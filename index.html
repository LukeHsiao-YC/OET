<title>OET 臨床字彙查房</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=IBM+Plex+Mono:wght@400;600&family=Noto+Sans+TC:wght@400;700&display=swap">
<style>
/* Layout: one centred column like a case-note sheet; ballpoint-blue ink for answers, red pen for corrections */
:root{
  --paper:#F5F6F2; --card:#FFFFFF; --ink:#1C2230; --muted:#5D6676; --line:#DADED6;
  --pen:#2645A3; --pen-soft:#E6EBF8; --red:#C0392B; --red-soft:#FBE9E6; --ok:#2C7A4B; --ok-soft:#E3F2E8;
  --amber:#A86A10;
  --f-display:"Bricolage Grotesque","Noto Sans TC",system-ui,sans-serif;
  --f-body:"Atkinson Hyperlegible","Noto Sans TC",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#11141A; --card:#191D26; --ink:#E7E9EE; --muted:#9AA2B1; --line:#2B313D;
  --pen:#93AAF2; --pen-soft:#212B45; --red:#F07B6D; --red-soft:#3A2220; --ok:#6CC28E; --ok-soft:#1C3326; --amber:#E2A84A;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#11141A; --card:#191D26; --ink:#E7E9EE; --muted:#9AA2B1; --line:#2B313D;
  --pen:#93AAF2; --pen-soft:#212B45; --red:#F07B6D; --red-soft:#3A2220; --ok:#6CC28E; --ok-soft:#1C3326; --amber:#E2A84A;
  color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.55}
.wrap{max-width:780px;margin:0 auto;padding:20px 16px 64px}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.15}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--pen);outline-offset:2px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.label{font-family:var(--f-mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}

header.top{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;padding-bottom:16px;border-bottom:2px solid var(--ink)}
header.top h1{font-size:clamp(26px,6vw,36px);font-weight:800;letter-spacing:-.01em}
header.top h1 span{color:var(--pen)}
.meta{display:flex;gap:16px;flex-wrap:wrap}
.meta div{display:flex;flex-direction:column;align-items:flex-end}
.meta b{font-family:var(--f-mono);font-size:22px;font-variant-numeric:tabular-nums}

.hero{margin-top:24px;display:grid;gap:12px}
.hero p{margin:0;max-width:62ch}
.btn{border:1.5px solid var(--ink);background:var(--card);border-radius:6px;padding:10px 16px;font-weight:700}
.btn.primary{background:var(--pen);border-color:var(--pen);color:var(--card)}
.btn.ghost{border-color:var(--line)}
.btn:disabled{opacity:.45;cursor:default}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}

.section{margin-top:28px}
.section h2{font-size:20px;margin-bottom:12px}
.beds{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px}
.bed{text-align:left;border:1px solid var(--line);background:var(--card);border-radius:6px;padding:12px;display:flex;flex-direction:column;gap:4px;min-height:124px}
.bed .no{font-family:var(--f-mono);font-size:12px;color:var(--muted);display:flex;justify-content:space-between;gap:6px}
.bed .en{font-family:var(--f-display);font-weight:700;font-size:16px}
.bed .zh{font-size:14px;color:var(--muted)}
.bed .chip{margin-top:auto;align-self:flex-start}
.bed.today{border:2px solid var(--pen)}
.mini{height:4px;background:var(--line);border-radius:2px;overflow:hidden;margin-top:6px}
.mini i{display:block;height:100%;background:var(--pen)}
.chip{font-family:var(--f-mono);font-size:11px;letter-spacing:.04em;padding:2px 7px;border-radius:999px;border:1px solid var(--line);color:var(--muted)}
.chip.done{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.chip.now{background:var(--pen-soft);color:var(--pen);border-color:transparent}

.skills{display:grid;grid-template-columns:repeat(4,1fr);gap:0;border:1px solid var(--line);border-radius:6px;background:var(--card);overflow:hidden}
.sk{text-align:left;border:0;border-right:1px solid var(--line);background:transparent;padding:12px 14px;display:flex;flex-direction:column;gap:2px;min-width:0}
.sk:last-child{border-right:0}
.sk:hover{background:var(--pen-soft)}
.sk b{font-family:var(--f-display);font-size:17px}
.sk span{font-size:13px;color:var(--muted)}
@media (max-width:560px){.skills{grid-template-columns:1fr 1fr}.sk:nth-child(2){border-right:0}.sk:nth-child(-n+2){border-bottom:1px solid var(--line)}}

.stats{margin-top:28px;display:grid;grid-template-columns:repeat(3,1fr);border:1px solid var(--line);border-radius:6px;background:var(--card)}
.stats div{padding:12px 14px;border-right:1px solid var(--line)}
.stats div:last-child{border-right:0}
.stats b{display:block;font-family:var(--f-mono);font-size:24px;font-variant-numeric:tabular-nums}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin-top:12px}
.bar i{display:block;height:100%;background:var(--pen)}

.sess-top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:4px}
.qcard{margin-top:16px;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:20px;display:grid;gap:16px}
.qhead{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.prompt{font-size:15px;color:var(--muted);margin:0}
.sent{font-size:clamp(19px,4.4vw,23px);line-height:1.45;margin:0;font-weight:400}
.blank{display:inline-block;min-width:4.5em;border-bottom:2px solid var(--ink);text-align:center;color:var(--pen);font-weight:700}
.opts{display:grid;gap:8px}
.opt{display:flex;gap:12px;align-items:center;text-align:left;border:1.5px solid var(--line);background:var(--card);border-radius:6px;padding:11px 14px;font-size:17px}
.opt:hover:not(:disabled){border-color:var(--pen)}
.opt kbd{font-family:var(--f-mono);font-size:12px;color:var(--muted);border:1px solid var(--line);border-radius:4px;padding:0 6px}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.wrong{border-color:var(--red);background:var(--red-soft)}
.opt.wrong span{text-decoration:line-through;text-decoration-color:var(--red);text-decoration-thickness:2px}
.typein{display:flex;gap:8px;flex-wrap:wrap}
.typein input{flex:1 1 220px;min-width:0;font:inherit;font-size:19px;padding:10px 12px;border:1.5px solid var(--ink);border-radius:6px;background:var(--paper);color:var(--ink);font-family:var(--f-mono)}
.listen{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.zhbig{font-size:22px;font-weight:700}
.tokens,.built{display:flex;flex-wrap:wrap;gap:8px;min-height:46px}
.built{border-bottom:2px solid var(--ink);padding-bottom:8px}
.tok{border:1.5px solid var(--line);background:var(--paper);border-radius:5px;padding:6px 10px;font-size:17px}
.built .tok{border-color:var(--pen);color:var(--pen)}

.fb{border-top:1px dashed var(--line);padding-top:14px;display:grid;gap:10px}
.verdict{font-family:var(--f-display);font-weight:800;font-size:20px}
.verdict.ok{color:var(--ok)} .verdict.no{color:var(--red)}
.fix s{color:var(--red);text-decoration-thickness:2px}
.fix b{color:var(--pen)}
.full{font-size:18px;min-width:0}
.gloss{font-size:15px}
.xp{font-size:15px;background:var(--paper);border-left:3px solid var(--amber);padding:8px 12px;margin:0}
.speak{border:1px solid var(--line);background:transparent;border-radius:999px;padding:4px 12px;font-size:14px}

.end h2{font-size:28px;margin-top:20px}
.list{display:grid;margin-top:12px;border:1px solid var(--line);border-radius:6px;background:var(--card)}
.li{display:grid;grid-template-columns:1fr auto;gap:4px 12px;padding:10px 14px;border-bottom:1px solid var(--line);align-items:center}
.li:last-child{border-bottom:0}
.li .t{font-weight:700;min-width:0}
.li .z{color:var(--muted);font-size:14px;grid-column:1}
.dots{display:flex;gap:3px;grid-row:1/3;grid-column:2}
.dots i{width:8px;height:8px;border-radius:50%;background:var(--line)}
.dots i.on{background:var(--pen)}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-top:16px}
.tab{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:5px 12px;font-size:14px}
.tab[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.grp{margin-top:20px}
.grp h3{font-size:17px}
.note{font-size:14px;color:var(--muted);margin-top:16px;max-width:62ch}
.notes{font-family:var(--f-mono);font-size:15px;line-height:1.6;background:var(--paper);border:1px solid var(--line);border-left:4px solid var(--ink);padding:12px 14px;margin:0;white-space:pre-wrap;overflow-wrap:anywhere}
.passage{font-size:16px;line-height:1.65;background:var(--paper);border-left:4px solid var(--pen);padding:12px 14px;margin:0;max-width:68ch}
.qq{font-weight:700;margin:0}
textarea.rw{width:100%;min-height:96px;font:inherit;font-size:17px;line-height:1.5;padding:10px 12px;border:1.5px solid var(--ink);border-radius:6px;background:var(--paper);color:var(--ink);resize:vertical}
.cmp{display:grid;gap:10px}
.cmp .yours{border-left:3px solid var(--muted);padding:6px 12px;margin:0}
.cmp .model{border-left:3px solid var(--ok);padding:6px 12px;margin:0}
.checks{list-style:none;margin:0;padding:0;display:grid;gap:4px;font-size:15px}
.checks li{display:flex;gap:8px;align-items:baseline}
.checks .y{color:var(--ok);font-weight:700}
.checks .n{color:var(--red);font-weight:700}
.checks .w{color:var(--amber);font-weight:700}
.para{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px}
.pcard{text-align:left;border:1px solid var(--line);background:var(--card);border-radius:6px;padding:12px;display:flex;flex-direction:column;gap:4px}
.pcard b{font-family:var(--f-display);font-size:16px}
.pcard span{font-size:13px;color:var(--muted)}
.synform{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.synform input{flex:1 1 140px;min-width:0;font:inherit;padding:9px 11px;border:1.5px solid var(--line);border-radius:6px;background:var(--card);color:var(--ink)}
.syrow{display:grid;grid-template-columns:1fr auto;gap:4px 12px;padding:10px 14px;border-bottom:1px solid var(--line);align-items:center}
.syrow:last-child{border-bottom:0}
.syrow .pair{font-weight:700;min-width:0;overflow-wrap:anywhere}
.syrow .pair span{color:var(--pen)}
.syrow .acts{display:flex;gap:6px}
.small{border:1px solid var(--line);background:transparent;border-radius:999px;padding:3px 10px;font-size:13px}
.small[aria-pressed="true"]{background:var(--ok-soft);color:var(--ok);border-color:transparent}
/* reading lab */
.clock{font-family:var(--f-mono);font-variant-numeric:tabular-nums;font-size:20px;font-weight:600;padding:2px 10px;border-radius:6px;background:var(--pen-soft);color:var(--pen)}
.clock.warn{background:var(--red-soft);color:var(--amber)}
.clock.over{background:var(--red-soft);color:var(--red)}
.steps{margin:0;padding-left:20px;font-size:15px;color:var(--muted);display:grid;gap:2px}
.article{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:18px 20px;display:grid;gap:12px;max-width:72ch}
.article h3{font-size:21px}
.article p{margin:0;line-height:1.7}
.dim{filter:blur(3.5px);opacity:.55;user-select:none;transition:filter .3s,opacity .3s}
@media (prefers-reduced-motion:reduce){.dim{transition:none}}
.pno{font-family:var(--f-mono);font-size:12px;color:var(--muted);margin-right:6px}
.qbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:2;background:var(--paper);padding-block:10px;border-bottom:1px solid var(--line);display:grid;gap:10px}
.qbar .qtext{font-size:18px;font-weight:700;margin:0}
.texts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:14px}
@media (max-width:640px){.texts{grid-template-columns:1fr}}
.tx{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:12px 14px;min-width:0}
.tx h4{font-family:var(--f-display);font-size:16px;margin:0 0 8px;display:flex;gap:8px;align-items:baseline}
.tx h4 .k{font-family:var(--f-mono);background:var(--ink);color:var(--paper);border-radius:4px;padding:0 6px;font-size:13px}
.tx.hit{border-color:var(--ok);box-shadow:0 0 0 2px var(--ok-soft)}
.sen{display:inline;font:inherit;font-size:15px;line-height:1.65;text-align:left;border:0;background:transparent;padding:0;color:var(--ink);cursor:default;border-radius:3px}
.tapmode .sen{cursor:pointer}
.tapmode .sen:hover{background:var(--pen-soft)}
.sen.hit{background:var(--ok-soft);outline:2px solid var(--ok)}
.sen.miss{background:var(--red-soft);text-decoration:line-through;text-decoration-color:var(--red)}
.letters{display:flex;gap:8px;flex-wrap:wrap}
.letters .btn{min-width:56px}
.map{font-size:15px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.map code{font-family:var(--f-mono);font-size:14px;background:var(--pen-soft);color:var(--pen);padding:1px 6px;border-radius:4px}
.res{display:grid;grid-template-columns:repeat(3,1fr);border:1px solid var(--line);border-radius:6px;background:var(--card);margin-top:16px}
.res div{padding:12px 14px;border-right:1px solid var(--line)}
.res div:last-child{border-right:0}
.res b{display:block;font-family:var(--f-mono);font-size:22px;font-variant-numeric:tabular-nums}
.times{display:flex;gap:4px;align-items:flex-end;height:64px;margin-top:12px;border-bottom:1px solid var(--line)}
.times i{flex:1;background:var(--pen);border-radius:2px 2px 0 0;min-height:2px}
.times i.slow{background:var(--red)}
.disclaim{font-size:13px;color:var(--muted)}
.tx.block .sen{display:block;margin-bottom:6px}
.notesheet{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:8px 0}
.nrow{display:grid;grid-template-columns:minmax(90px,150px) 1fr;gap:10px;padding:6px 14px;align-items:baseline}
.nrow+.nrow{border-top:1px dashed var(--line)}
.nl{font-family:var(--f-mono);font-size:13px;color:var(--muted)}
.nc{min-width:0;line-height:2}
.lain{font:inherit;font-family:var(--f-mono);font-size:15px;width:12em;max-width:100%;padding:3px 8px;border:1.5px solid var(--ink);border-radius:5px;background:var(--paper);color:var(--ink)}
.okc{color:var(--ok)} .noc{color:var(--red);text-decoration:line-through}
.script{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:12px 14px;display:grid;gap:8px;font-size:15px;line-height:1.65;max-height:60vh;overflow:auto}
.script p{margin:0}
mark{background:var(--ok-soft);color:inherit;outline:1px solid var(--ok);border-radius:2px}
.opt.sel{border-color:var(--pen);background:var(--pen-soft)}
.cmpw{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (max-width:700px){.cmpw{grid-template-columns:1fr}}
.letter{white-space:pre-wrap;font-family:var(--f-body);font-size:14.5px;line-height:1.6;background:var(--card);border:1px solid var(--line);border-left:4px solid var(--muted);padding:12px 14px;margin:0;overflow-wrap:anywhere}
.letter.model{border-left-color:var(--ok)}
select{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:5px;padding:2px 6px}
details summary{padding-block:4px}
.tipbar{margin:0;font-size:14px;background:var(--pen-soft);color:var(--ink);border-left:3px solid var(--pen);padding:8px 12px;border-radius:0 6px 6px 0}
.kw{cursor:pointer;border-radius:3px}
.kw:hover{background:var(--pen-soft)}
.kw.on{background:var(--amber);color:var(--card);text-decoration:underline}
.raimgs{display:grid;gap:10px;margin-top:10px}
.raimgs img{width:100%;border:1px solid var(--line);border-radius:6px;background:#fff}
@media (max-width:480px){.stats b{font-size:20px}.qcard{padding:16px}}
@media (prefers-reduced-motion:no-preference){.qcard{animation:in .18s ease-out}@keyframes in{from{transform:translateY(4px);opacity:.6}to{transform:none;opacity:1}}}
</style>

<div class="wrap" id="app"></div>

<script>
/* ---------- units ---------- */
const SK={L:"Listening",R:"Reading",W:"Writing",S:"Speaking"};
const SKDESC={L:"Part A 筆記拼字、病人說法轉臨床用字",R:"Part A 用藥資訊、B 院內公告、C 態度與改寫",W:"病歷筆記轉信件、搭配詞、轉介信用語",S:"白話解釋、同理、確認理解"};
const UNITS=[
 {u:1,en:"Symptoms",zh:"常見症狀",sk:["L","W"],tip:"Listening Part A 的填空答案大多是症狀字，拼錯就不給分。英式和美式拼法都接受，但要前後一致。"},
 {u:2,en:"Conditions",zh:"常見疾病",sk:["L","S"],tip:"要會拼，也要能用病人聽得懂的話解釋。"},
 {u:3,en:"Describing symptoms",zh:"病人說法轉筆記用字",sk:["L"],tip:"Listening Part A 的病人用口語描述，筆記要寫臨床用字：comes and goes 寫成 intermittent。"},
 {u:4,en:"Clinical verbs",zh:"臨床動詞",sk:["W","R"],tip:"轉介信大量使用被動式與過去式：was diagnosed、was commenced on。"},
 {u:5,en:"Severity & course",zh:"嚴重度與病程",sk:["L","W"],tip:"例如 severe pain、gradual improvement。錯誤的搭配會拉低 Language 分數。"},
 {u:6,en:"Patient history",zh:"病史",sk:["W","R"],tip:"信件開頭的病史段落。兒科信件還會寫 birth、developmental、immunisation history。"},
 {u:7,en:"Case notes to letter",zh:"病歷筆記轉信件",sk:["W"],tip:"Writing 的考題給的是筆記格式。縮寫要改成完整句子，不能照抄筆記。"},
 {u:8,en:"Treatment",zh:"治療與處置",sk:["W","S"],tip:"信件的 management 段落，以及口說解釋治療時使用。"},
 {u:9,en:"Medication",zh:"用藥與劑量",sk:["R"],tip:"Reading Part A 常要從幾篇短文裡找出劑量、禁忌與給藥方式。"},
 {u:10,en:"Risk & evidence",zh:"風險與證據",sk:["R","W"],tip:"Reading Part C 的研究型文章常出現 associated with、incidence、outweigh。"},
 {u:11,en:"Workplace notices",zh:"院內公告語氣",sk:["R"],tip:"Reading Part B 考公告和政策的目的與語氣，例如 must 和 should 的差別、unless 帶出的例外。"},
 {u:12,en:"Attitude & paraphrase",zh:"態度與同義改寫",sk:["R","L"],tip:"Reading Part C 和 Listening Part C 常考作者或講者的態度，正確選項幾乎都經過改寫。"},
 {u:13,en:"Letter language",zh:"轉介信用語",sk:["W"],tip:"開頭先說明目的，內容只放相關資訊，再用連接詞讓段落順暢。"},
 {u:14,en:"Consultation skills",zh:"溝通與角色扮演",sk:["S"],tip:"Speaking 的臨床溝通評分包括同理、了解病人的想法、預告接下來要談什麼（signposting），以及確認對方聽懂。"},
 {u:15,en:"Prepositions & forms",zh:"介系詞與詞性",sk:["W","R"],tip:"例如 diagnosed with、allergic to，以及 comply、compliance、compliant 的詞性變化。"},
 {u:16,en:"Lay explanations",zh:"術語白話解釋",sk:["S"],tip:"要能在專業術語和病人聽得懂的說法之間切換，這是 Speaking 拿 350+ 的關鍵。"},
 {u:17,en:"Notes to sentences",zh:"筆記改寫成完整句子",sk:["W"],tip:"書中改寫方法第一項：把簡短的病歷筆記改寫成完整句子。寫完後和範例比對，逐項檢查關鍵資訊、縮寫和句子結構。"},
 {u:18,en:"Summarising",zh:"段落摘要改寫",sk:["R","W"],tip:"書中改寫方法第二項：讀一小段醫學文字，再用自己的話摘要。Reading Part C 的正確選項就是這樣改寫出來的。"},

function rwCheck(q,txt){
  const hits=q.k.map(([l,r])=>({l,ok:new RegExp(r,"i").test(txt)}));
  const warn=[];
  if(q.mode==="notes"){
    const ab=(txt.match(ABBR)||[]).map(x=>x.trim());
    if(ab.length)warn.push("還留著筆記縮寫或口語：「"+[...new Set(ab)].join("、")+"」，信件裡要改寫出來。");
    if(!/^[A-Z]/.test(txt.trim()))warn.push("句子開頭要大寫。");
    if(!/[.!?]$/.test(txt.trim()))warn.push("句子結尾要有句點。");
    if(!/\b(is|are|was|were|has|have|had|been|showed|reported|complain\w*|lives|uses|attends|missed|vomited|stopped|prescribed|started|presented|would|includes?)\b/i.test(txt))warn.push("看起來缺少動詞，可能還是筆記格式。");
  }else{
    const w=s=>s.toLowerCase().replace(/[^a-z0-9' ]/g," ").split(/\s+/).filter(Boolean);
    const src=w(q.n).join(" "),mine=w(txt);let copied=0,seen=new Set();
    for(let i=0;i+5<=mine.length;i++){const g=mine.slice(i,i+5).join(" ");if(src.includes(g)&&!seen.has(i)){copied++;for(let j=i;j<i+5;j++)seen.add(j)}}
    if(copied)warn.push("有 "+copied+" 處連續五個字以上和原文相同，試著用自己的話說。");
    if(mine.length>45)warn.push("摘要有 "+mine.length+" 個字，試著縮短到 40 字以內，只寫主旨。");
    if(mine.length<8)warn.push("摘要太短，可能漏了重點。");
  }
  return{hits,warn,all:hits.every(h=>h.ok)};
}

const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const norm=s=>s.toLowerCase().replace(/[’']/g,"'").replace(/[.\s]+$/,"").replace(/\s+/g," ").trim();
const unitItems=u=>ITEMS.filter(i=>i.u===u);
const unitSeen=u=>unitItems(u).filter(i=>S.box[i.id]).length;
function currentUnit(){for(const x of UNITS){if(x.u===MOCK)continue;if(unitSeen(x.u)<unitItems(x.u).length)return x.u}return 0}

/* ---------- speech ---------- */
let voice=null;
function pickVoice(){try{const v=speechSynthesis.getVoices();voice=v.find(x=>/en-GB/i.test(x.lang))||v.find(x=>/en-AU/i.test(x.lang))||v.find(x=>/^en/i.test(x.lang))||null}catch(e){}}
try{pickVoice();speechSynthesis.onvoiceschanged=pickVoice}catch(e){}
const canSpeak=()=>{try{return "speechSynthesis" in window}catch(e){return false}};
function speak(t,rate){try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang=voice?voice.lang:"en-GB";if(voice)u.voice=voice;u.rate=rate||.92;speechSynthesis.speak(u)}catch(e){}}

/* ---------- session ---------- */
let V={view:"home"};
const weakest=(list,n)=>shuffle(list).sort((a,b)=>boxOf(a)-boxOf(b)).slice(0,n);
function build(mode,arg){
  let pool=[];
  if(mode==="day"){
    const fresh=shuffle(unitItems(arg).filter(i=>!S.box[i.id])).slice(0,NEW_PER_ROUND);
    const rev=weakest(ITEMS.filter(i=>S.box[i.id]&&isDue(i)),REV_PER_ROUND);
    pool=shuffle(fresh.concat(rev));
  }else if(mode==="mock"){
    pool=shuffle(weakest(ITEMS,25));
  }else if(mode==="review"){
    let due=ITEMS.filter(i=>S.box[i.id]&&isDue(i));
    if(due.length<10)due=weakest(ITEMS.filter(i=>S.box[i.id]),15);
    pool=shuffle(due).slice(0,20);
  }else if(mode==="cat"){
    pool=shuffle(weakest(unitItems(arg),20));
  }else if(mode==="skill"){
    const us=UNITS.filter(x=>x.u!==MOCK&&x.sk.includes(arg)).map(x=>x.u);
    pool=shuffle(weakest(ITEMS.filter(i=>us.includes(i.u)),20));
  }else if(mode==="mysyn"){
    const v=synItems().filter(i=>i.qs[0].o.length>=4);v.forEach(i=>BYID[i.id]=i);
    pool=shuffle(v).slice(0,20);
  }else if(mode==="para"){
    pool=shuffle([17,18,19,20].flatMap(u=>weakest(unitItems(u),5)));
  }else if(mode==="weak"){
    pool=shuffle(ITEMS.filter(i=>S.box[i.id]&&S.box[i.id].wrong>0&&S.box[i.id].box<=2)).slice(0,20);
  }
  const queue=pool.map(i=>({id:i.id,qi:Math.floor(Math.random()*i.qs.length),retry:false}));
  return{mode,arg,queue,pos:0,right:0,firstTry:{},missed:[],answered:false,pick:null,built:[],tokens:[]};
}
function start(mode,arg){
  const s=build(mode,arg);
  if(!s.queue.length&&mode==="mysyn"){V={view:"syn",flash:"至少需要 4 組同義詞才能出選擇題。"};render();return}
  if(!s.queue.length){V={view:"home",flash:mode==="weak"?"錯題本目前是空的，先完成一回合吧。":"還沒有可以複習的項目，先從今天的單元開始。"};render();return}
  V={view:"q",s};prepQ();render();window.scrollTo(0,0);
}
function cur(){const s=V.s,e=s.queue[s.pos],it=BYID[e.id];return{e,it,q:it.qs[e.qi]}}
function prepQ(){
  const s=V.s;s.answered=false;s.pick=null;s.built=[];s.ok=null;s.spoke=false;s.rw=null;s.draft=null;
  const {q}=cur();
  if(q.t==="mc")s.opts=shuffle(q.o);
  if(q.t==="or")s.tokens=shuffle(q.a.split(" ").map((w,k)=>({w,k})));
}
function grade(ok){
  const s=V.s,{e,it}=cur();s.answered=true;s.ok=ok;
  if(!(e.id in s.firstTry)&&e.id.startsWith("my:")){
    s.firstTry[e.id]=ok;if(ok)s.right++;else s.missed.push(e.id);
  }else if(!(e.id in s.firstTry)){
    s.firstTry[e.id]=ok;
    const r=S.box[e.id]||{box:0,due:today(),wrong:0,seen:0};
    r.seen++;
    if(ok){r.box=Math.min(5,r.box+1);r.due=addDays(today(),INT[r.box])}
    else{r.box=1;r.due=today();r.wrong++;s.missed.push(e.id)}
    S.box[e.id]=r;S.total=(S.total||0)+1;save();
    if(ok)s.right++;
  }
  if(!ok&&!e.retry){
    const alt=it.qs.length>1?(e.qi+1)%it.qs.length:e.qi;
    s.queue.push({id:e.id,qi:alt,retry:true});
  }
  render();
}
function next(){const s=V.s;s.pos++;if(s.pos>=s.queue.length){finish();return}prepQ();render();window.scrollTo(0,0)}
function finish(){
  const t=today();
  if(S.streak.last!==t){S.streak.count=S.streak.last===addDays(t,-1)?S.streak.count+1:1;S.streak.last=t}
  save();V={view:"end",s:V.s};render();window.scrollTo(0,0);
}

  return `<header class="top"><div><div class="label">OET Medicine · 350+ vocabulary</div><h1>臨床字彙<span>查房</span></h1></div>

}

}

    const tot=unitItems(x.u).length,seen=unitSeen(x.u),done=seen===tot,now=x.u===cu;if(!tot)return "";

      let c="";if(s.answered){if(o===q.o[0])c="right";else if(o===s.pick)c="wrong"}

function book(){
  const f=V.filter||"all";
  const ok=i=>{const r=S.box[i.id];if(f==="weak")return r&&r.box<=2&&r.wrong>0;if(f==="new")return !r;if(f==="mastered")return r&&r.box>=4;return true};

function playLines(lines,rate,onEnd){

  const spk=[...new Set(lines.map(l=>l[0]))];let last=null;
  lines.forEach(([s,t])=>{const idx=spk.indexOf(s);(t.match(/[^.?!…]+[.?!…]*["’)]*\s*/g)||[t]).forEach(seg=>{

    return header()+`<section class="end"><h2>${esc(t.name)} · ${esc(M.title)}</h2><div class="res"><div><span class="label">答對</span><b>${sc}/${tot}</b></div><div><span class="label">正確率</span><b>${Math.round(sc/tot*100)}%</b></div><div><span class="label">最佳</span><b>${(S.lab[recKey(t.id,O.m)]||{}).best||0}</b></div></div>
    ${O.res.filter(r=>!r.ok).length?`<h3 style="font-size:17px;margin-top:18px">答錯的題目</h3><div class="list">${O.res.filter(r=>!r.ok).map(r=>`<div class="li" style="grid-template-columns:1fr"><span class="t">${esc(r.q)}</span><span class="z">正解：${esc(r.ans)}　${esc(r.x)}</span></div>`).join("")}</div>`:""}
    <div class="row" style="margin-top:12px"><button class="btn primary" data-a="home">回到首頁</button><button class="btn" data-a="off" data-t="${t.id}" data-m="${O.m}">再練一次</button><button class="btn ghost" data-a="syn">看我的同義詞表</button></div></section>`}
  const skimmable=!L&&G.passage.length>=4;
  if(skimmable&&!O.skimDone){
    return topBar(`${t.name} · ${M.title} · ${O.gi+1}/${M.groups.length} · 先略讀`,`<span class="clock" data-start="${O.sk0}" data-dur="120000">2:00</span>`)+`<section class="hero">${tipBar("RC")}
    <ol class="steps"><li>讀標題</li><li>讀每段第一句（粗體）</li><li>注意重複的關鍵字</li><li>說得出每段在講什麼，再開始作答</li></ol>
    <article class="article" style="max-width:none"><h3>${esc(G.intro)}</h3>${G.passage.map((p,k)=>{const [f,r]=firstSplit(p);return `<p><span class="pno">¶${k+1}</span><b>${esc(f)}</b> <span class="${O.skimFull?"":"dim"}">${esc(r)}</span></p>`}).join("")}</article>
    <div class="row">${O.skimFull?"":`<button class="btn" data-a="gskfull">展開全文快速掃過</button>`}<button class="btn primary" data-a="gskgo">開始作答</button></div></section>`;
  }
  const evs=G.qs.map(q=>q.ev);
  const body=L?(O.checked||O.showScript?`<div class="script">${G.script.map(l=>{const nm=spkName(l,false);return `<p>${nm?`<b class="mono">${esc(nm)}:</b> `:""}${O.checked?hl(l[1],evs):esc(l[1])}</p>`}).join("")}</div>`:"")
    :`<article class="article" style="max-width:none">${G.passage.map((p,k)=>`<p>${G.passage.length>1?`<span class="pno">¶${k+1}</span>`:""}${O.checked?hl(p,evs):esc(p)}</p>`).join("")}</article>`;
  const qs=G.qs.map((q,qi)=>{const pk=O.picks[qi];return `<div class="qcard" style="margin-top:12px"><p class="qq">${O.checked?esc(q.q):kwText(q.q)}</p><div class="opts">${q.o.map((o,oi)=>{let c="";if(O.checked){if(oi===q.a)c="right";else if(oi===pk)c="wrong"}else if(oi===pk)c="sel";
    return `<button class="opt ${c}" data-a="gpick" data-q="${qi}" data-i="${oi}" ${O.checked?"disabled":""} aria-pressed="${oi===pk}"><kbd>${"ABCD"[oi]}</kbd><span>${esc(o)}</span></button>`}).join("")}</div>
    ${O.checked?`${q.pp?`<div class="map"><span class="label">改寫對應</span><code>${esc(q.pp[0])}</code>↔<code>${esc(q.pp[1])}</code>${synBtnFor(q.pp[0],q.pp[1])}</div>`:""}<p class="xp">${esc(q.x)}</p>`:""}</div>`}).join("");
  const all=G.qs.every((_,qi)=>O.picks[qi]!=null);
  return topBar(`${t.name} · ${M.title} · ${O.gi+1}/${M.groups.length}`,`<span class="clock" ${O.checked?"":`data-start="${O.gt0}"`}>${fmtT(Date.now()-(O.gt0||Date.now()))}</span>`)+`
  <section class="hero">${O.gi===0&&!O.checked?tipBar(O.m):""}<p class="muted" style="margin:0"><b>${esc(G.intro)}</b></p>${G.note?`<p class="xp">${esc(G.note)}</p>`:""}${L?audioCtl(O)+(!O.checked?`<button class="btn ghost" data-a="gscript" style="justify-self:start">${O.showScript?"隱藏文字稿":"看文字稿（練習用）"}</button>`:""):""}
  ${!O.checked?`<p class="note" style="margin:0">點題目中的字可以畫底線，先圈出關鍵字再作答。</p>`:""}
  ${L?qs+body:body+qs}
  <div class="row">${O.checked?`<button class="btn primary" data-a="gnext">${O.gi+1<M.groups.length?"下一題組":"看結果"}</button>`:`<button class="btn primary" data-a="gcheck" ${all?"":"disabled"}>對答案</button>`}</div></section>`;
}
function gCheck(){const O=V.O,M=OBY[O.tid][O.m],G=M.groups[O.gi];stopTTS();O.checked=true;
  G.qs.forEach((q,qi)=>O.res.push({ok:O.picks[qi]===q.a,q:q.q,ans:"ABCD"[q.a]+". "+q.o[q.a],x:q.x}));render()}
function gNext(){const O=V.O,t=OBY[O.tid],M=t[O.m];stopTTS();
  if(O.gi+1<M.groups.length){O.gi++;O.picks={};O.checked=false;O.plays=0;O.showScript=false;O.gt0=Date.now();O.skimDone=false;O.skimFull=false;O.sk0=Date.now()}else{O.done=true;saveRec(recKey(t.id,O.m),O.res.filter(r=>r.ok).length,O.res.length)}
  render();window.scrollTo(0,0)}
/* Writing */
const COLLO=[[/\bdiagnosed\s+(for|as having)\b/i,"diagnosed for → diagnosed with"],[/\breferr?ed\s+for\s+(a|an|the)?\s*(cardiologist|specialist|gastroenterologist|endocrinologist|neurologist|dermatologist|paediatrician|pediatrician|surgeon|physician|you)\b/i,"referred for + 人 → referred to + 人"],[/\b(strong|big|heavy)\s+pain\b/i,"strong/big pain → severe pain"],[/\b(big|heavy|strong)\s+fever\b/i,"big/heavy fever → high fever"],[/\bbig\s+swelling\b/i,"big swelling → marked / moderate swelling"],[/\bdiscuss(ed|es|ing)?\s+about\b/i,"discuss about → discuss（不加 about）"],[/\bdespite\s+of\b/i,"despite of → despite / in spite of"],[/\bcomplain(ed|s|ing)?\s+about\s+(pain|abdominal|chest|headache|nausea|dizziness|shortness|fatigue|dysphagia)/i,"complained about + 症狀 → complained of"],[/\ballergic\s+(with|for|from)\b/i,"allergic with → allergic to"],[/\bhistory\s+of\s+family\b/i,"history of family … → family history of …"],[/\badmitted\s+in\s+hospital\b/i,"admitted in hospital → admitted to hospital"],[/\bcontinuous\s+improvement\b/i,"continuous improvement → gradual improvement"],[/\bsuffer(s|ed|ing)?\s+with\b/i,"suffering with → suffering from"],[/\bresponded\s+(good|nicely)\b/i,"responded good → responded well"],[/\b(I|we)\s+am\s+writing\s+you\b/i,"I am writing you → I am writing to you / to refer"],[/\bpt\b|\byrs?\b|\bwks?\b|\bmths?\b/i,"縮寫 pt / yrs / wks → patient / years / weeks"]];
function colloCheck(txt){return COLLO.filter(([r])=>r.test(txt)).map(([r,s])=>({hit:(txt.match(r)||[""])[0],s}))}
function wView(){
  const O=V.O,t=OBY[O.tid],W=t.W,nSteps=W.rw?4:3,stepN=ph=>({rel:1,rw:2,write:W.rw?3:2,review:W.rw?4:3})[ph];
  const head=lbl=>topBar(`${t.name} · Writing · 步驟 ${stepN(O.phase)}／${nSteps}：${lbl}`);
  if(O.phase==="rel"){
    const done=O.relChecked,n=W.notes.length,right=W.notes.filter((x,i)=>O.marks[i]===x.inc).length;
    return head("挑選相關資訊")+`<section class="hero">${tipBar("W")}<p class="muted">${esc(W.date)}</p><p class="xp">${esc(W.task)}</p>
    <p>先決定每一條筆記要不要寫進轉介信。OET Writing 的 Content 和 Conciseness 會看你有沒有挑對。</p>
    <div class="list">${W.notes.map((x,i)=>{const m=O.marks[i];return `<div class="syrow"><span class="pair" style="font-weight:400">${esc(x.t)}${done?`<br><span class="muted" style="font-size:14px">${x.inc?"範例有寫":"範例省略"}：${esc(x.why)}</span>`:""}</span>
      <span class="acts">${done?`<span class="chip ${m===x.inc?"done":""}">${m===x.inc?"✓ 判斷一致":m==null?"未選":"✗ 不一致"}</span>`:`<button class="small" data-a="wmark" data-i="${i}" data-v="1" aria-pressed="${m===true}">寫</button><button class="small" data-a="wmark" data-i="${i}" data-v="0" aria-pressed="${m===false}">省略</button>`}</span></div>`}).join("")}</div>
    ${done?`<p class="xp">你的判斷和範例信一致的有 ${right}/${n} 條。範例信只是其中一種寫法，關鍵是：主訴、相關病史、用藥、藥物過敏和已做的處置都要寫；陳舊或無關的病史要省略。</p><div class="row"><button class="btn primary" data-a="${W.rw?"wrw":"wgo"}">${W.rw?"下一步：筆記改寫成句子":"下一步：計時寫信"}</button></div>`
    :`<div class="row"><button class="btn primary" data-a="wrel">和範例對照</button><button class="btn ghost" data-a="${W.rw?"wrw":"wgo"}">跳過</button></div>`}</section>`;
  }
  if(O.phase==="rw"){
    const i=O.ri||0,q=Object.assign({mode:"notes"},W.rw[i]),r=O.rwRes&&O.rwRes[i];
    return head(`筆記改寫成句子 ${i+1}/${W.rw.length}`)+`<section class="hero"><p class="muted">Unit 17 的練習用在這份考題上：把這段筆記寫成信件裡的句子。</p>
    <pre class="notes">${esc(q.n)}</pre>
    ${r?`<div class="cmp"><div><div class="label">你的版本</div><p class="yours">${esc(r.txt)}</p></div><div><div class="label">參考寫法</div><p class="model">${esc(q.m)}</p></div>
      <ul class="checks">${r.hits.map(h=>`<li><span class="${h.ok?"y":"n"}">${h.ok?"✓":"✗"}</span><span>${esc(h.l)}</span></li>`).join("")}${r.warn.map(w=>`<li><span class="w">!</span><span>${esc(w)}</span></li>`).join("")}${colloCheck(r.txt).map(c=>`<li><span class="w">!</span><span>搭配詞：「${esc(c.hit)}」→ ${esc(c.s)}</span></li>`).join("")}</ul></div>
      <div class="row">${i+1<W.rw.length?`<button class="btn primary" data-a="wrwnext">下一段</button>`:`<button class="btn primary" data-a="wgo">下一步：計時寫信</button>`}</div>`
    :`<form data-f="wrw" style="display:grid;gap:10px"><textarea class="rw" id="ans" aria-label="改寫成句子">${esc((O.rwDraft||{})[i]||"")}</textarea><div class="row"><button class="btn primary">對照參考寫法</button><button class="btn ghost" type="button" data-a="wgo">跳過，直接寫信</button></div></form>`}</section>`;
  }
  if(O.phase==="write"){
    return topBar(`${t.name} · Writing · 步驟 ${stepN("write")}／${nSteps}：寫信（5 分鐘閱讀＋40 分鐘寫作）`,`<span class="clock" data-start="${O.t0}" data-dur="2700000">45:00</span>`)+`<section class="hero">
    <p class="xp">${esc(W.task)}</p>
    <details><summary class="label" style="cursor:pointer">病歷筆記</summary><pre class="notes">${esc(W.date)}\n\n${W.notes.map(x=>"• "+x.t).join("\n")}</pre></details>
    <textarea class="rw" id="wtext" style="min-height:360px" aria-label="你的轉介信" placeholder="Dear Dr …,\n\nRe: …\n\nThank you for seeing …">${esc(O.text)}</textarea>
    <div class="row"><span class="mono" id="wc">${wcount(O.text)}</span><button class="btn primary" data-a="wsubmit">交卷，和範例對照</button></div></section>`;
  }
  const txt=O.text||"",body=bodyOf(txt),wc=body.split(/\s+/).filter(Boolean).length;
  const ab=[...new Set((txt.match(ABBR)||[]).map(x=>x.trim()))],cc=colloCheck(txt);
  return head("對照範例")+`<section class="hero">
  <div class="res"><div><span class="label">正文字數</span><b>${wc}</b></div><div><span class="label">建議</span><b>180–200</b></div><div><span class="label">重點涵蓋</span><b>${W.checks.filter(([,r])=>new RegExp(r,"i").test(txt)).length}/${W.checks.length}</b></div></div>
  <ul class="checks">${W.checks.map(([l,r])=>{const ok=new RegExp(r,"i").test(txt);return `<li><span class="${ok?"y":"n"}">${ok?"✓":"✗"}</span><span>${esc(l)}</span></li>`}).join("")}
  ${ab.length?`<li><span class="w">!</span><span>還有筆記縮寫：${esc(ab.join("、"))}。縮寫第一次出現要寫全（Unit 7）。</span></li>`:""}
  ${cc.map(c=>`<li><span class="w">!</span><span>搭配詞／介系詞：「${esc(c.hit)}」→ ${esc(c.s)}（Unit 5、15）</span></li>`).join("")}
  ${!cc.length&&txt?`<li><span class="y">✓</span><span>沒有抓到常見的搭配詞或介系詞錯誤</span></li>`:""}
  ${wc<160||wc>230?`<li><span class="w">!</span><span>正文 ${wc} 字，離建議的 180–200 字有點遠。</span></li>`:""}</ul>
  <div class="cmpw"><div><div class="label">你的信</div><pre class="letter">${esc(txt)||"（空白）"}</pre></div><div><div class="label">官方範例</div><pre class="letter model">${esc(W.sample)}</pre></div></div>
  <h3 style="font-size:17px">OET Writing 六項評分，自己檢查一次</h3>
  <ul class="steps"><li>Purpose：前兩句就說清楚轉介目的</li><li>Content：主訴、相關病史、用藥、過敏、已做的處置都有寫</li><li>Conciseness &amp; Clarity：無關的病史已省略</li><li>Genre &amp; Style：正式語氣，沒有筆記格式或口語</li><li>Organisation &amp; Layout：段落依序是目的、主訴、相關病史、處置、請求</li><li>Language：時態、冠詞、介系詞、搭配詞正確</li></ul>
  <div class="row"><button class="btn primary" data-a="wdone">完成</button><button class="btn ghost" data-a="wback">回去修改</button></div></section>`;
}
function bodyOf(t){const a=t.search(/Dear\b[^\n]*\n/i);let s=t;if(a>=0)s=s.slice(s.indexOf("\n",a)+1);const bb=s.search(/\n\s*Yours\b/i);if(bb>=0)s=s.slice(0,bb);s=s.replace(/^\s*Re:[^\n]*\n(\s*DOB[^\n]*\n)?/i,"");return s.trim()}
function wcount(t){const n=bodyOf(t||"").split(/\s+/).filter(Boolean).length;return `正文 ${n} 字`}
/* Speaking */
const COMM=["開場：自我介紹並確認來診目的","用開放式問題了解狀況，再用封閉式問題確認細節","回應情緒（例如：That must be worrying）","術語換成白話，或說完術語馬上解釋","說明前先預告（First, I’d like to explain…）","確認理解（請對方用自己的話說一次）","探詢擔憂：Is there anything that worries you?","總結並說明下一步"];
function layBox(SP){return SP.lay?`<details ${O_open()}><summary class="label" style="cursor:pointer">術語 → 白話（Unit 16）</summary><ul class="checks">${SP.lay.map(([a,b])=>`<li><span class="y">›</span><span><b>${esc(a)}</b> → ${esc(b)}</span></li>`).join("")}</ul></details>`:""}
function O_open(){return ""}

    <div class="article" style="max-width:none"><span class="label">CANDIDATE CARD · ${esc(SP.setting)} · DOCTOR</span>${SP.card.map(c=>`<p>${esc(c)}</p>`).join("")}</div>
    ${SP.lay?`<div><span class="label">準備時先想好：這些術語要怎麼用白話說？</span><ul class="checks">${SP.lay.map(([a,b],i)=>`<li><span class="y">›</span><span><b>${esc(a)}</b> ${O.layOpen?`→ ${esc(b)}`:""}</span></li>`).join("")}</ul>${O.layOpen?"":`<button class="btn ghost" data-a="splay" style="margin-top:6px">看白話說法</button>`}</div>`:""}

    ${layBox(SP)}

    <details><summary class="label" style="cursor:pointer">角色卡</summary><div class="article" style="max-width:none">${SP.card.map(c=>`<p>${esc(c)}</p>`).join("")}</div></details>
    ${layBox(SP)}
    <article class="qcard"><span class="label">病人說</span><p class="sent" style="font-size:19px">${esc(st.p)}</p>${canSpeak()?`<button class="speak" data-a="say" data-v="${esc(st.p)}" style="justify-self:start">🔊 播放病人台詞</button>`:""}
    <p class="xp">你的任務：${esc(st.task)}</p>

}

  <p class="note">目前 ${S.syn.length} 組，其中 ${ctrl} 組標記為「能用」。書中建議表要小，只放你寫作和口說時真的敢用的字。不確定的字，練熟之前先別在考試用。</p>
  <form class="synform" data-f="syn"><input id="syA" placeholder="OET 用字，例如 commence" aria-label="OET 用字" autocomplete="off"><input id="syB" placeholder="你的說法，例如 start" aria-label="同義說法" autocomplete="off"><button class="btn primary">加入</button></form>

  ${S.syn.length?`<div class="list">${S.syn.map((p,k)=>`<div class="syrow"><span class="pair">${esc(p.a)} = <span>${esc(p.b)}</span></span><span class="acts"><button class="small" data-a="synok" data-i="${k}" aria-pressed="${!!p.ok}">${p.ok?"能用":"練習中"}</button><button class="small" data-a="syndel" data-i="${k}" aria-label="刪除 ${esc(p.a)}">刪除</button>${canSpeak()?`<button class="small" data-a="say" data-v="${esc(p.a)}">朗讀</button>`:""}</span></div>`).join("")}</div>`:'<p class="muted" style="margin-top:16px">表還是空的。去 Unit 20 答題時點「加入我的同義詞表」，或在上面自己輸入。</p>'}`;
}
function render(){
  if(V.view==="syn"){app.innerHTML=synview();return}
  if(["oLA","oG","oW","oS"].includes(V.view)){app.innerHTML=V.view==="oLA"?laView():V.view==="oG"?gView():V.view==="oW"?wView():sView();return}
  if(V.view==="skim"||V.view==="scan"){app.innerHTML=V.view==="skim"?skimview():scanview();
    const nb=document.getElementById("nextBtn");if(nb)nb.focus({preventScroll:true});else{const i=document.getElementById("ans");if(i&&!i.disabled)i.focus({preventScroll:true})}return}
  if(V.view==="home")app.innerHTML=home();
  else if(V.view==="q")app.innerHTML=qview();
  else if(V.view==="end")app.innerHTML=endview();
  else if(V.view==="book")app.innerHTML=book();
  if(V.view==="q"){
    const s=V.s,{q}=cur();
    if(!s.answered){const inp=document.getElementById("ans");if(inp)inp.focus();if(q.t==="li"&&!s.spoke){s.spoke=true;speak(q.a[0])}}
    else{const nb=document.getElementById("nextBtn");if(nb)nb.focus()}
  }
}
app.addEventListener("click",ev=>{
  const b=ev.target.closest("[data-a]");if(!b)return;
  const a=b.dataset.a,d=+b.dataset.d;
  if(a==="day")start("day",d);
  else if(a==="cat")start("cat",d);
  else if(a==="mock")start("mock");
  else if(a==="skill")start("skill",b.dataset.k);
  else if(a==="review")start("review");
  else if(a==="weak")start("weak");
  else if(a==="para")start("para");
  else if(a==="mysyn")start("mysyn");
  else if(a==="syn"){V={view:"syn"};render();window.scrollTo(0,0)}
  else if(a==="synok"){const p=S.syn[+b.dataset.i];p.ok=!p.ok;save();render()}
  else if(a==="syndel"){S.syn.splice(+b.dataset.i,1);save();render()}
  else if(a==="addsyn"){addSyn(b.dataset.x,b.dataset.y);render()}
  else if(a==="rwok"||a==="rwno")grade(a==="rwok");
  else if(a==="skim")startSkim(b.dataset.id);
  else if(a==="scan")startScan(b.dataset.id);
  else if(a==="skfull"){V.L.phase="full";render()}
  else if(a==="skgo"){V.L.phase="q";V.L.tEnd=Date.now();render();window.scrollTo(0,0)}
  else if(a==="skpick"){const L=V.L,P=SKIM.find(x=>x.id===L.id),q=P.q[L.qi];if(L.answered)return;const c=q.t==="para"?"¶"+(q.a+1):q.o[0];L.answered=true;L.pick=b.dataset.v;L.picks[L.qi]=b.dataset.v===c;render()}
  else if(a==="sknext"){const L=V.L,P=SKIM.find(x=>x.id===L.id);L.qi++;L.answered=false;L.pick=null;L.opts=null;if(L.qi>=P.q.length)L.phase="sum";render()}
  else if(a==="skdone"){const L=V.L,P=SKIM.find(x=>x.id===L.id),t=L.tEnd-L.t0,sc=L.picks.filter(Boolean).length,r=labRec(P.id);
    if(sc>=3&&(!r.best||t<r.best))r.best=t;r.last=t;r.score=sc;S.lab[P.id]=r;touchStreak();save();L.phase="done";render();window.scrollTo(0,0)}
  else if(a==="scpick"){const T=getScan(V.L.id),q=T.q[V.L.qi];scanAnswer(b.dataset.v===q.a,b.dataset.v)}
  else if(a==="sctap"){const T=getScan(V.L.id),q=T.q[V.L.qi];scanAnswer(b.dataset.v===q.loc[0]+q.loc[1],b.dataset.v)}
  else if(a==="scnext")scanNext();
  else if(a==="off")startOff(b.dataset.t,b.dataset.m);
  else if(a==="offquit"){stopTTS();V={view:"home"};render();window.scrollTo(0,0)}
  else if(a==="oplay"){const O=V.O,t=OBY[O.tid];const lines=V.view==="oLA"?t.LA.extracts[O.ei].script:t[O.m].groups[O.gi].script;O.plays++;const s=document.querySelector(".hero .muted[style*='13px']");playLines(lines,O.rate);if(s)s.textContent="已播放 "+O.plays+" 次（正式考試只播一次）"}
  else if(a==="ostop")stopTTS();
  else if(a==="lacheck")laCheck();
  else if(a==="lanext")laNext();
  else if(a==="lascript"){V.O.peek=!V.O.peek;render()}
  else if(a==="gpick"){V.O.picks[+b.dataset.q]=+b.dataset.i;render()}
  else if(a==="gcheck")gCheck();
  else if(a==="gnext")gNext();
  else if(a==="gscript"){V.O.showScript=!V.O.showScript;render()}
  else if(a==="wmark"){V.O.marks[+b.dataset.i]=b.dataset.v==="1";render()}
  else if(a==="wrel"){V.O.relChecked=true;render()}
  else if(a==="wgo"){V.O.phase="write";V.O.t0=V.O.t0||Date.now();render();window.scrollTo(0,0)}
  else if(a==="wsubmit"){V.O.phase="review";render();window.scrollTo(0,0)}
  else if(a==="wback"){V.O.phase="write";render()}
  else if(a==="wdone"){const k=recKey(V.O.tid,"W");S.lab[k]=Object.assign(S.lab[k]||{},{done:true});touchStreak();save();V={view:"home"};render();window.scrollTo(0,0)}
  else if(a==="spgo"){V.O.phase="play";V.O.t0=Date.now();render();window.scrollTo(0,0)}
  else if(a==="spshow"){V.O.open[V.O.step]=true;render()}
  else if(a==="spnext"){stopTTS();V.O.step++;render();window.scrollTo(0,0)}
  else if(a==="spdone"){stopTTS();V.O.phase="done";render();window.scrollTo(0,0)}
  else if(a==="spfin"){const k=recKey(V.O.tid,"S");S.lab[k]=Object.assign(S.lab[k]||{},{done:true,last:Object.values(V.O.ck).filter(Boolean).length,total:COMM.length});touchStreak();save();V={view:"home"};render();window.scrollTo(0,0)}
  else if(a==="spck"){V.O.ck[+b.dataset.i]=!V.O.ck[+b.dataset.i];render()}
  else if(a==="splay"){V.O.layOpen=true;render()}
  else if(a==="kw"){b.classList.toggle("on")}
  else if(a==="raimg"){V.L.showImg=!V.L.showImg;render()}
  else if(a==="laspell"){const O=V.O,t=OBY[O.tid];addSpell(t.id,b.dataset.n,t.LA.extracts[O.ei].items[b.dataset.n]);render()}
  else if(a==="gskfull"){V.O.skimFull=true;render()}
  else if(a==="gskgo"){V.O.skimDone=true;V.O.gt0=Date.now();render();window.scrollTo(0,0)}
  else if(a==="wrw"){V.O.phase="rw";V.O.ri=0;V.O.rwRes={};V.O.rwDraft={};render();window.scrollTo(0,0)}
  else if(a==="wrwnext"){V.O.ri++;render();window.scrollTo(0,0)}
  else if(a==="home"){V={view:"home"};render();window.scrollTo(0,0)}
  else if(a==="book"){V={view:"book",filter:"all"};render();window.scrollTo(0,0)}
  else if(a==="flt"){V.filter=b.dataset.v;render()}
  else if(a==="say")speak(b.dataset.v);
  else if(a==="slow")speak(b.dataset.v,.6);
  else if(a==="next")next();
  else if(a==="pick"){const {q}=cur();V.s.pick=b.dataset.v;grade(b.dataset.v===q.o[0])}
  else if(a==="tok"){const t=V.s.tokens.find(t=>t.k===+b.dataset.k);V.s.built.push(t);render()}
  else if(a==="unb"){V.s.built.splice(+b.dataset.i,1);render()}
  else if(a==="clr"){V.s.built=[];render()}
  else if(a==="chk"){const {q}=cur();const got=V.s.built.map(t=>t.w).join(" ");V.s.pick=got;grade(norm(got)===norm(q.a))}
});
app.addEventListener("submit",ev=>{
  ev.preventDefault();
  const f=ev.target.dataset.f;
  if(f==="syn"){const A=document.getElementById("syA"),B=document.getElementById("syB");
    const ok=addSyn(A.value,B.value);V.flash=ok?"已加入："+A.value.trim()+" = "+B.value.trim():(A.value.trim()&&B.value.trim()?"這組已經在表裡了。":"兩格都要填。");render();const n=document.getElementById("syA");if(n)n.focus();return}
  const inp=document.getElementById("ans");if(!inp||!inp.value.trim())return;
  if(f==="wrw"){const O=V.O,W=OBY[O.tid].W,q=Object.assign({mode:"notes"},W.rw[O.ri]),tx=inp.value.trim();O.rwRes[O.ri]={txt:tx,...rwCheck(q,tx)};render();return}
  if(f==="sksum"){const P=SKIM.find(x=>x.id===V.L.id),t=inp.value.trim();V.L.sum={txt:t,...rwCheck({k:P.sum.k,mode:"sum",n:P.paras.join(" ")},t)};render();return}
  if(f==="scshort"){const T=getScan(V.L.id),q=T.q[V.L.qi];scanAnswer(new RegExp(q.a,"i").test(inp.value),inp.value.trim());return}
  if(f==="rw"){const {q}=cur();V.s.draft=inp.value;V.s.rw={txt:inp.value.trim(),...rwCheck(q,inp.value.trim())};render();return}
  const {q}=cur();V.s.pick=inp.value.trim();grade(q.a.some(x=>norm(x)===norm(inp.value)));
});
document.addEventListener("keydown",ev=>{
  if(V.view!=="q")return;const s=V.s;
  if(ev.target.tagName==="TEXTAREA"){if(ev.key==="Enter"&&(ev.ctrlKey||ev.metaKey)){ev.preventDefault();ev.target.form.requestSubmit()}return}
  if(s.answered&&ev.key==="Enter"&&ev.target.tagName!=="BUTTON"){ev.preventDefault();next();return}
  if(!s.answered&&cur().q.t==="mc"&&/^[1-4]$/.test(ev.key)&&ev.target.tagName!=="INPUT"){const o=s.opts[+ev.key-1];if(o){s.pick=o;grade(o===cur().q.o[0])}}
});
app.addEventListener("change",ev=>{if(ev.target.id==="orate"&&V.O)V.O.rate=+ev.target.value});
app.addEventListener("input",ev=>{
  if(ev.target.dataset&&ev.target.dataset.la&&V.O){V.O.vals[ev.target.dataset.la]=ev.target.value;return}
  if(ev.target.id==="wtext"&&V.O){V.O.text=ev.target.value;const w=document.getElementById("wc");if(w)w.textContent=wcount(V.O.text);return}if(ev.target.id==="ans"&&ev.target.tagName==="TEXTAREA"&&V.s)V.s.draft=ev.target.value});
function boot(data){if(data&&data.V&&(data.V.view!=="q"||(data.V.s&&data.V.s.queue.every(e=>BYID[e.id]))))V=data.V;render()}
try{window.claude?.hot?.snapshot?.(()=>({V}))}catch(e){}
window.claude?.hot?.ready?window.claude.hot.ready(boot):boot(window.claude?.hot?.data??{});
</script>
