<title>OET 臨床字彙查房</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=IBM+Plex+Mono:wght@400;600&family=Noto+Sans+TC:wght@400;700&display=swap">
<style>
/* Layout: one centred column like a case-note sheet; ballpoint-blue ink for answers, red pen for corrections */
:root{
  --paper:#F5F6F2; --card:#FFFFFF; --ink:#1C2230; --muted:#5D6676; --line:#DADED6;
  --pen:#2645A3; --pen-soft:#E6EBF8; --red:#C0392B; --red-soft:#FBE9E6; --ok:#2C7A4B; --ok-soft:#E3F2E8;
  --amber:#A86A10;
  --f-display:"Bricolage Grotesque","Noto Sans TC",system-ui,sans-serif;
  --f-body:"Atkinson Hyperlegible","Noto Sans TC",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#11141A; --card:#191D26; --ink:#E7E9EE; --muted:#9AA2B1; --line:#2B313D;
  --pen:#93AAF2; --pen-soft:#212B45; --red:#F07B6D; --red-soft:#3A2220; --ok:#6CC28E; --ok-soft:#1C3326; --amber:#E2A84A;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#11141A; --card:#191D26; --ink:#E7E9EE; --muted:#9AA2B1; --line:#2B313D;
  --pen:#93AAF2; --pen-soft:#212B45; --red:#F07B6D; --red-soft:#3A2220; --ok:#6CC28E; --ok-soft:#1C3326; --amber:#E2A84A;
  color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.55}
.wrap{max-width:780px;margin:0 auto;padding:20px 16px 64px}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.15}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--pen);outline-offset:2px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.label{font-family:var(--f-mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}

header.top{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;padding-bottom:16px;border-bottom:2px solid var(--ink)}
header.top h1{font-size:clamp(26px,6vw,36px);font-weight:800;letter-spacing:-.01em}
header.top h1 span{color:var(--pen)}
.meta{display:flex;gap:16px;flex-wrap:wrap}
.meta div{display:flex;flex-direction:column;align-items:flex-end}
.meta b{font-family:var(--f-mono);font-size:22px;font-variant-numeric:tabular-nums}

.hero{margin-top:24px;display:grid;gap:12px}
.hero p{margin:0;max-width:62ch}
.btn{border:1.5px solid var(--ink);background:var(--card);border-radius:6px;padding:10px 16px;font-weight:700}
.btn.primary{background:var(--pen);border-color:var(--pen);color:var(--card)}
.btn.ghost{border-color:var(--line)}
.btn:disabled{opacity:.45;cursor:default}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}

.section{margin-top:28px}
.section h2{font-size:20px;margin-bottom:12px}
.beds{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px}
.bed{text-align:left;border:1px solid var(--line);background:var(--card);border-radius:6px;padding:12px;display:flex;flex-direction:column;gap:4px;min-height:124px}
.bed .no{font-family:var(--f-mono);font-size:12px;color:var(--muted);display:flex;justify-content:space-between;gap:6px}
.bed .en{font-family:var(--f-display);font-weight:700;font-size:16px}
.bed .zh{font-size:14px;color:var(--muted)}
.bed .chip{margin-top:auto;align-self:flex-start}
.bed.today{border:2px solid var(--pen)}
.mini{height:4px;background:var(--line);border-radius:2px;overflow:hidden;margin-top:6px}
.mini i{display:block;height:100%;background:var(--pen)}
.chip{font-family:var(--f-mono);font-size:11px;letter-spacing:.04em;padding:2px 7px;border-radius:999px;border:1px solid var(--line);color:var(--muted)}
.chip.done{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.chip.now{background:var(--pen-soft);color:var(--pen);border-color:transparent}

.skills{display:grid;grid-template-columns:repeat(4,1fr);gap:0;border:1px solid var(--line);border-radius:6px;background:var(--card);overflow:hidden}
.sk{text-align:left;border:0;border-right:1px solid var(--line);background:transparent;padding:12px 14px;display:flex;flex-direction:column;gap:2px;min-width:0}
.sk:last-child{border-right:0}
.sk:hover{background:var(--pen-soft)}
.sk b{font-family:var(--f-display);font-size:17px}
.sk span{font-size:13px;color:var(--muted)}
@media (max-width:560px){.skills{grid-template-columns:1fr 1fr}.sk:nth-child(2){border-right:0}.sk:nth-child(-n+2){border-bottom:1px solid var(--line)}}

.stats{margin-top:28px;display:grid;grid-template-columns:repeat(3,1fr);border:1px solid var(--line);border-radius:6px;background:var(--card)}
.stats div{padding:12px 14px;border-right:1px solid var(--line)}
.stats div:last-child{border-right:0}
.stats b{display:block;font-family:var(--f-mono);font-size:24px;font-variant-numeric:tabular-nums}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin-top:12px}
.bar i{display:block;height:100%;background:var(--pen)}

.sess-top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:4px}
.qcard{margin-top:16px;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:20px;display:grid;gap:16px}
.qhead{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.prompt{font-size:15px;color:var(--muted);margin:0}
.sent{font-size:clamp(19px,4.4vw,23px);line-height:1.45;margin:0;font-weight:400}
.blank{display:inline-block;min-width:4.5em;border-bottom:2px solid var(--ink);text-align:center;color:var(--pen);font-weight:700}
.opts{display:grid;gap:8px}
.opt{display:flex;gap:12px;align-items:center;text-align:left;border:1.5px solid var(--line);background:var(--card);border-radius:6px;padding:11px 14px;font-size:17px}
.opt:hover:not(:disabled){border-color:var(--pen)}
.opt kbd{font-family:var(--f-mono);font-size:12px;color:var(--muted);border:1px solid var(--line);border-radius:4px;padding:0 6px}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.wrong{border-color:var(--red);background:var(--red-soft)}
.opt.wrong span{text-decoration:line-through;text-decoration-color:var(--red);text-decoration-thickness:2px}
.typein{display:flex;gap:8px;flex-wrap:wrap}
.typein input{flex:1 1 220px;min-width:0;font:inherit;font-size:19px;padding:10px 12px;border:1.5px solid var(--ink);border-radius:6px;background:var(--paper);color:var(--ink);font-family:var(--f-mono)}
.listen{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.zhbig{font-size:22px;font-weight:700}
.tokens,.built{display:flex;flex-wrap:wrap;gap:8px;min-height:46px}
.built{border-bottom:2px solid var(--ink);padding-bottom:8px}
.tok{border:1.5px solid var(--line);background:var(--paper);border-radius:5px;padding:6px 10px;font-size:17px}
.built .tok{border-color:var(--pen);color:var(--pen)}

.fb{border-top:1px dashed var(--line);padding-top:14px;display:grid;gap:10px}
.verdict{font-family:var(--f-display);font-weight:800;font-size:20px}
.verdict.ok{color:var(--ok)} .verdict.no{color:var(--red)}
.fix s{color:var(--red);text-decoration-thickness:2px}
.fix b{color:var(--pen)}
.full{font-size:18px;min-width:0}
.gloss{font-size:15px}
.xp{font-size:15px;background:var(--paper);border-left:3px solid var(--amber);padding:8px 12px;margin:0}
.speak{border:1px solid var(--line);background:transparent;border-radius:999px;padding:4px 12px;font-size:14px}

.end h2{font-size:28px;margin-top:20px}
.list{display:grid;margin-top:12px;border:1px solid var(--line);border-radius:6px;background:var(--card)}
.li{display:grid;grid-template-columns:1fr auto;gap:4px 12px;padding:10px 14px;border-bottom:1px solid var(--line);align-items:center}
.li:last-child{border-bottom:0}
.li .t{font-weight:700;min-width:0}
.li .z{color:var(--muted);font-size:14px;grid-column:1}
.dots{display:flex;gap:3px;grid-row:1/3;grid-column:2}
.dots i{width:8px;height:8px;border-radius:50%;background:var(--line)}
.dots i.on{background:var(--pen)}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-top:16px}
.tab{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:5px 12px;font-size:14px}
.tab[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.grp{margin-top:20px}
.grp h3{font-size:17px}
.note{font-size:14px;color:var(--muted);margin-top:16px;max-width:62ch}
.notes{font-family:var(--f-mono);font-size:15px;line-height:1.6;background:var(--paper);border:1px solid var(--line);border-left:4px solid var(--ink);padding:12px 14px;margin:0;white-space:pre-wrap;overflow-wrap:anywhere}
.passage{font-size:16px;line-height:1.65;background:var(--paper);border-left:4px solid var(--pen);padding:12px 14px;margin:0;max-width:68ch}
.qq{font-weight:700;margin:0}
textarea.rw{width:100%;min-height:96px;font:inherit;font-size:17px;line-height:1.5;padding:10px 12px;border:1.5px solid var(--ink);border-radius:6px;background:var(--paper);color:var(--ink);resize:vertical}
.cmp{display:grid;gap:10px}
.cmp .yours{border-left:3px solid var(--muted);padding:6px 12px;margin:0}
.cmp .model{border-left:3px solid var(--ok);padding:6px 12px;margin:0}
.checks{list-style:none;margin:0;padding:0;display:grid;gap:4px;font-size:15px}
.checks li{display:flex;gap:8px;align-items:baseline}
.checks .y{color:var(--ok);font-weight:700}
.checks .n{color:var(--red);font-weight:700}
.checks .w{color:var(--amber);font-weight:700}
.para{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px}
.pcard{text-align:left;border:1px solid var(--line);background:var(--card);border-radius:6px;padding:12px;display:flex;flex-direction:column;gap:4px}
.pcard b{font-family:var(--f-display);font-size:16px}
.pcard span{font-size:13px;color:var(--muted)}
.synform{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.synform input{flex:1 1 140px;min-width:0;font:inherit;padding:9px 11px;border:1.5px solid var(--line);border-radius:6px;background:var(--card);color:var(--ink)}
.syrow{display:grid;grid-template-columns:1fr auto;gap:4px 12px;padding:10px 14px;border-bottom:1px solid var(--line);align-items:center}
.syrow:last-child{border-bottom:0}
.syrow .pair{font-weight:700;min-width:0;overflow-wrap:anywhere}
.syrow .pair span{color:var(--pen)}
.syrow .acts{display:flex;gap:6px}
.small{border:1px solid var(--line);background:transparent;border-radius:999px;padding:3px 10px;font-size:13px}
.small[aria-pressed="true"]{background:var(--ok-soft);color:var(--ok);border-color:transparent}
/* reading lab */
.clock{font-family:var(--f-mono);font-variant-numeric:tabular-nums;font-size:20px;font-weight:600;padding:2px 10px;border-radius:6px;background:var(--pen-soft);color:var(--pen)}
.clock.warn{background:var(--red-soft);color:var(--amber)}
.clock.over{background:var(--red-soft);color:var(--red)}
.steps{margin:0;padding-left:20px;font-size:15px;color:var(--muted);display:grid;gap:2px}
.article{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:18px 20px;display:grid;gap:12px;max-width:72ch}
.article h3{font-size:21px}
.article p{margin:0;line-height:1.7}
.dim{filter:blur(3.5px);opacity:.55;user-select:none;transition:filter .3s,opacity .3s}
@media (prefers-reduced-motion:reduce){.dim{transition:none}}
.pno{font-family:var(--f-mono);font-size:12px;color:var(--muted);margin-right:6px}
.qbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:2;background:var(--paper);padding-block:10px;border-bottom:1px solid var(--line);display:grid;gap:10px}
.qbar .qtext{font-size:18px;font-weight:700;margin:0}
.texts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:14px}
@media (max-width:640px){.texts{grid-template-columns:1fr}}
.tx{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:12px 14px;min-width:0}
.tx h4{font-family:var(--f-display);font-size:16px;margin:0 0 8px;display:flex;gap:8px;align-items:baseline}
.tx h4 .k{font-family:var(--f-mono);background:var(--ink);color:var(--paper);border-radius:4px;padding:0 6px;font-size:13px}
.tx.hit{border-color:var(--ok);box-shadow:0 0 0 2px var(--ok-soft)}
.sen{display:inline;font:inherit;font-size:15px;line-height:1.65;text-align:left;border:0;background:transparent;padding:0;color:var(--ink);cursor:default;border-radius:3px}
.tapmode .sen{cursor:pointer}
.tapmode .sen:hover{background:var(--pen-soft)}
.sen.hit{background:var(--ok-soft);outline:2px solid var(--ok)}
.sen.miss{background:var(--red-soft);text-decoration:line-through;text-decoration-color:var(--red)}
.letters{display:flex;gap:8px;flex-wrap:wrap}
.letters .btn{min-width:56px}
.map{font-size:15px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.map code{font-family:var(--f-mono);font-size:14px;background:var(--pen-soft);color:var(--pen);padding:1px 6px;border-radius:4px}
.res{display:grid;grid-template-columns:repeat(3,1fr);border:1px solid var(--line);border-radius:6px;background:var(--card);margin-top:16px}
.res div{padding:12px 14px;border-right:1px solid var(--line)}
.res div:last-child{border-right:0}
.res b{display:block;font-family:var(--f-mono);font-size:22px;font-variant-numeric:tabular-nums}
.times{display:flex;gap:4px;align-items:flex-end;height:64px;margin-top:12px;border-bottom:1px solid var(--line)}
.times i{flex:1;background:var(--pen);border-radius:2px 2px 0 0;min-height:2px}
.times i.slow{background:var(--red)}
.disclaim{font-size:13px;color:var(--muted)}
.tx.block .sen{display:block;margin-bottom:6px}
.notesheet{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:8px 0}
.nrow{display:grid;grid-template-columns:minmax(90px,150px) 1fr;gap:10px;padding:6px 14px;align-items:baseline}
.nrow+.nrow{border-top:1px dashed var(--line)}
.nl{font-family:var(--f-mono);font-size:13px;color:var(--muted)}
.nc{min-width:0;line-height:2}
.lain{font:inherit;font-family:var(--f-mono);font-size:15px;width:12em;max-width:100%;padding:3px 8px;border:1.5px solid var(--ink);border-radius:5px;background:var(--paper);color:var(--ink)}
.okc{color:var(--ok)} .noc{color:var(--red);text-decoration:line-through}
.script{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:12px 14px;display:grid;gap:8px;font-size:15px;line-height:1.65;max-height:60vh;overflow:auto}
.script p{margin:0}
mark{background:var(--ok-soft);color:inherit;outline:1px solid var(--ok);border-radius:2px}
.opt.sel{border-color:var(--pen);background:var(--pen-soft)}
.cmpw{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (max-width:700px){.cmpw{grid-template-columns:1fr}}
.letter{white-space:pre-wrap;font-family:var(--f-body);font-size:14.5px;line-height:1.6;background:var(--card);border:1px solid var(--line);border-left:4px solid var(--muted);padding:12px 14px;margin:0;overflow-wrap:anywhere}
.letter.model{border-left-color:var(--ok)}
select{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:5px;padding:2px 6px}
details summary{padding-block:4px}
.tipbar{margin:0;font-size:14px;background:var(--pen-soft);color:var(--ink);border-left:3px solid var(--pen);padding:8px 12px;border-radius:0 6px 6px 0}
.kw{cursor:pointer;border-radius:3px}
.kw:hover{background:var(--pen-soft)}
.kw.on{background:var(--amber);color:var(--card);text-decoration:underline}
.raimgs{display:grid;gap:10px;margin-top:10px}
.raimgs img{width:100%;border:1px solid var(--line);border-radius:6px;background:#fff}
@media (max-width:480px){.stats b{font-size:20px}.qcard{padding:16px}}
@media (prefers-reduced-motion:no-preference){.qcard{animation:in .18s ease-out}@keyframes in{from{transform:translateY(4px);opacity:.6}to{transform:none;opacity:1}}}
mark.lg{background:var(--amber);color:var(--card);border-radius:3px;padding:0 2px}
sup.lgt{font-size:10px;color:var(--amber);margin-left:1px}
.s5t{font:inherit;border:0;background:none;padding:0;color:inherit;cursor:pointer}
.s5t.ok{background:var(--ok-soft);outline:2px solid var(--ok)}
.s5t.no{background:var(--red-soft);outline:2px dashed var(--red)}
.patnav{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}
.pchip{min-width:34px;height:32px;border:1px solid var(--line);border-radius:6px;background:var(--card);color:var(--ink);font-family:var(--f-mono);font-size:13px;cursor:pointer}
.pchip.ans{background:var(--ok-soft)}
.pchip.dot{border-color:var(--amber);border-width:2px}
.pchip.uns{border-style:dashed}
.pchip.cur{outline:2px solid var(--ink)}
.sen.pick{background:var(--pen-soft);outline:2px solid var(--ink)}
.chainbar{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 12px;margin:8px 0;border:1px solid var(--amber);border-radius:6px;font-size:14px}
details summary{cursor:pointer}
</style>

<div class="wrap" id="app"></div>

<script>
/* ---------- units ---------- */
const SK={L:"Listening",R:"Reading",W:"Writing",S:"Speaking"};
const SKDESC={L:"Part A 筆記拼字、病人說法轉臨床用字",R:"Part A 用藥資訊、B 院內公告、C 態度與改寫",W:"病歷筆記轉信件、搭配詞、轉介信用語",S:"白話解釋、同理、確認理解"};
const UNITS=[
 {u:1,en:"Symptoms",zh:"常見症狀",sk:["L","W"],tip:"Listening Part A 的填空答案大多是症狀字，拼錯就不給分。英式和美式拼法都接受，但要前後一致。"},
 {u:2,en:"Conditions",zh:"常見疾病",sk:["L","S"],tip:"要會拼，也要能用病人聽得懂的話解釋。"},
 {u:3,en:"Describing symptoms",zh:"病人說法轉筆記用字",sk:["L"],tip:"Listening Part A 的病人用口語描述，筆記要寫臨床用字：comes and goes 寫成 intermittent。"},
 {u:4,en:"Clinical verbs",zh:"臨床動詞",sk:["W","R"],tip:"轉介信大量使用被動式與過去式：was diagnosed、was commenced on。"},
 {u:5,en:"Severity & course",zh:"嚴重度與病程",sk:["L","W"],tip:"例如 severe pain、gradual improvement。錯誤的搭配會拉低 Language 分數。"},
 {u:6,en:"Patient history",zh:"病史",sk:["W","R"],tip:"信件開頭的病史段落。兒科信件還會寫 birth、developmental、immunisation history。"},
 {u:7,en:"Case notes to letter",zh:"病歷筆記轉信件",sk:["W"],tip:"Writing 的考題給的是筆記格式。縮寫要改成完整句子，不能照抄筆記。"},
 {u:8,en:"Treatment",zh:"治療與處置",sk:["W","S"],tip:"信件的 management 段落，以及口說解釋治療時使用。"},
 {u:9,en:"Medication",zh:"用藥與劑量",sk:["R"],tip:"Reading Part A 常要從幾篇短文裡找出劑量、禁忌與給藥方式。"},
 {u:10,en:"Risk & evidence",zh:"風險與證據",sk:["R","W"],tip:"Reading Part C 的研究型文章常出現 associated with、incidence、outweigh。"},
 {u:11,en:"Workplace notices",zh:"院內公告語氣",sk:["R"],tip:"Reading Part B 考公告和政策的目的與語氣，例如 must 和 should 的差別、unless 帶出的例外。"},
 {u:12,en:"Attitude & paraphrase",zh:"態度與同義改寫",sk:["R","L"],tip:"Reading Part C 和 Listening Part C 常考作者或講者的態度，正確選項幾乎都經過改寫。"},
 {u:13,en:"Letter language",zh:"轉介信用語",sk:["W"],tip:"開頭先說明目的，內容只放相關資訊，再用連接詞讓段落順暢。"},

const MOCK=22;

/* U1 symptoms */
I("pain",1,"pain","疼痛",[ty("Mrs Chen reported sharp ___ in her lower back since Monday.","pain","疼痛","pain 常與 sharp、dull、severe、intermittent 搭配。")]),

I("dizziness",1,"dizziness","頭暈",[li("dizziness","dizzy 變名詞時 y 改成 i：dizziness，不是 dizzyness。")]),
I("sob",1,"shortness of breath","呼吸急促、喘",[ty("He reported ___ on exertion.","shortness of breath","呼吸急促（三個字）","shortness of breath on exertion 是 Listening Part A 常見的筆記。形容詞說法是 short of breath。")]),

I("vomiting",1,"vomiting","嘔吐",[li("vomiting","只有一個 t：vomiting，不是 vomitting。")]),
I("headache",1,"headache","頭痛",[ty("She described a throbbing ___ behind her eyes.","headache","頭痛","headache 是一個字。throbbing headache：搏動性頭痛。")]),

I("fever",1,"fever","發燒",[ty("He developed a high ___ of 39.5°C overnight.","fever","發燒","要說 high fever，不說 big fever 或 heavy fever。")]),
I("rash",1,"rash","皮疹",[ty("A non-blanching ___ was noted on both legs.","rash","皮疹","non-blanching rash：壓不退色的皮疹。")]),
I("wheeze",1,"wheeze","喘鳴",[li("wheeze","wh-ee-ze；形容詞 wheezy。"),ty("Her mother noticed a ___ at night, especially after colds.","wheeze","喘鳴","夜間喘鳴是兒童氣喘的常見描述。")]),
I("palp",1,"palpitations","心悸",[li("palpitations","pal-pi-ta-tions，通常用複數。")]),

I("constip",1,"constipation","便秘",[li("constipation","con-sti-pa-tion。"),ty("She has a long history of ___, opening her bowels twice a week.","constipation","便秘","opening bowels 是描述排便的標準說法。")]),
I("lethargy",1,"lethargy","倦怠、活動力差",[li("lethargy","le-th-argy；形容詞 lethargic，兒科急診很常聽到。")]),
I("irrit",1,"irritability","躁動易哭",[li("irritability","irrit-a-bility；形容詞 irritable。")]),
I("appetite",1,"loss of appetite","食慾不振",[ty("She reported a loss of ___ and a weight loss of 3 kg.","appetite","食慾","loss of appetite / reduced appetite / poor appetite。")]),
I("wtloss",1,"weight loss","體重減輕",[mc("There has been significant ___ over the past two months.",["weight loss","weight losing","lost weight","weight lose"],"weight loss 是名詞片語；動詞說法是 lose weight。")]),
I("nsweats",1,"night sweats","夜間盜汗",[ty("He has had fevers and ___ for a month.","night sweats","夜間盜汗（兩個字）","night sweats 用複數。")]),

I("cough",1,"productive cough","有痰的咳嗽",[mc("He has a ___ cough with green sputum.",["productive","producing","phlegmy-type","wet-making"],"productive cough 是有痰的咳嗽，dry cough 是乾咳。")]),

I("inflammation",2,"inflammation","發炎",[li("inflammation","雙 m：infla-mm-ation；形容詞 inflammatory 也是雙 m。")]),
I("allergy",2,"allergy","過敏",[li("allergy","雙 l：a-ll-ergy。形容詞 allergic。")]),
I("anxiety",2,"anxiety","焦慮",[li("anxiety","an-x-i-ety；形容詞 anxious。")]),
I("depression",2,"depression","憂鬱症",[ty("She has a history of ___ treated with sertraline.","depression","憂鬱症","depression 和 anxiety 常出現在病史段落。")]),
I("gastro",2,"gastroenteritis","腸胃炎",[li("gastroenteritis","gastro-enter-itis：胃＋腸＋發炎。")]),
I("bronchiolitis",2,"bronchiolitis","細支氣管炎",[li("bronchiolitis","bronch-iol-itis；和 bronchitis（支氣管炎）不同。")]),
I("om",2,"otitis media","中耳炎",[ty("She was treated for acute ___ media last month.","otitis","中耳炎的第一個字","acute otitis media（AOM）。")]),
I("uti",2,"urinary tract infection","泌尿道感染",[ty("Urine culture confirmed a urinary tract ___.","infection","感染","筆記上的 UTI 在信件裡最好寫全：urinary tract infection。")]),
I("coeliac",2,"coeliac disease","乳糜瀉",[li(["coeliac","celiac"],"英式 coeliac、美式 celiac。")]),
I("eczema",2,"eczema","濕疹",[li("eczema","ec-ze-ma。")]),
I("epilepsy",2,"epilepsy","癲癇",[li("epilepsy","形容詞 epileptic；癲癇發作是 seizure。")]),
I("pneumonia",2,"pneumonia","肺炎",[li("pneumonia","開頭的 p 不發音：pneu-monia。")]),
I("append",2,"appendicitis","闌尾炎",[li("appendicitis","append-i-citis。")]),
I("dehyd",2,"dehydration","脫水",[ty("He was admitted with moderate ___ secondary to gastroenteritis.","dehydration","脫水","secondary to：繼發於。")]),
I("anaemia",2,"anaemia","貧血",[li(["anaemia","anemia"],"英式 anaemia、美式 anemia。")]),
I("obesity",2,"obesity","肥胖",[li("obesity","o-be-si-ty；形容詞 obese。對病人可改用 above a healthy weight 這類較溫和的說法。")]),

I("d_aggr",3,"exacerbated by","因…加重",[mc("Patient: “It gets worse when I lie down.” → pain ___ by lying flat",["exacerbated","relieved","caused","resolved"],"worse when → exacerbated by / aggravated by。",P2N)]),

I("d_dur",3,"a two-week history of","兩週病史",[mc("Patient: “It started about a fortnight ago.” → a ___ history of cough",["two-week","two-weeks","two weeks'","fortnightly"],"複合形容詞用單數並加連字號：a two-week history。",P2N)]),

function rwCheck(q,txt){
  const hits=q.k.map(([l,r])=>({l,ok:new RegExp(r,"i").test(txt)}));
  const warn=[];
  if(q.mode==="notes"){
    const ab=(txt.match(ABBR)||[]).map(x=>x.trim());
    if(ab.length)warn.push("還留著筆記縮寫或口語：「"+[...new Set(ab)].join("、")+"」，信件裡要改寫出來。");
    if(!/^[A-Z]/.test(txt.trim()))warn.push("句子開頭要大寫。");
    if(!/[.!?]$/.test(txt.trim()))warn.push("句子結尾要有句點。");
    if(!/\b(is|are|was|were|has|have|had|been|showed|reported|complain\w*|lives|uses|attends|missed|vomited|stopped|prescribed|started|presented|would|includes?)\b/i.test(txt))warn.push("看起來缺少動詞，可能還是筆記格式。");
  }else{
    const w=s=>s.toLowerCase().replace(/[^a-z0-9' ]/g," ").split(/\s+/).filter(Boolean);
    const src=w(q.n).join(" "),mine=w(txt);let copied=0,seen=new Set();
    for(let i=0;i+5<=mine.length;i++){const g=mine.slice(i,i+5).join(" ");if(src.includes(g)&&!seen.has(i)){copied++;for(let j=i;j<i+5;j++)seen.add(j)}}
    if(copied)warn.push("有 "+copied+" 處連續五個字以上和原文相同，試著用自己的話說。");
    if(mine.length>45)warn.push("摘要有 "+mine.length+" 個字，試著縮短到 40 字以內，只寫主旨。");
    if(mine.length<8)warn.push("摘要太短，可能漏了重點。");
  }
  return{hits,warn,all:hits.every(h=>h.ok)};
}

const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const norm=s=>s.toLowerCase().replace(/[’']/g,"'").replace(/[.\s]+$/,"").replace(/\s+/g," ").trim();
const unitItems=u=>ITEMS.filter(i=>i.u===u);
const unitSeen=u=>unitItems(u).filter(i=>S.box[i.id]).length;
function currentUnit(){for(const x of UNITS){if(x.u===MOCK)continue;if(unitSeen(x.u)<unitItems(x.u).length)return x.u}return 0}

/* ---------- speech ---------- */
let voice=null;
function pickVoice(){try{const v=speechSynthesis.getVoices();voice=v.find(x=>/en-GB/i.test(x.lang))||v.find(x=>/en-AU/i.test(x.lang))||v.find(x=>/^en/i.test(x.lang))||null}catch(e){}}
try{pickVoice();speechSynthesis.onvoiceschanged=pickVoice}catch(e){}
const canSpeak=()=>{try{return "speechSynthesis" in window}catch(e){return false}};
function speak(t,rate){try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang=voice?voice.lang:"en-GB";if(voice)u.voice=voice;u.rate=rate||.92;speechSynthesis.speak(u)}catch(e){}}

/* ---------- session ---------- */
let V={view:"home"};
const weakest=(list,n)=>shuffle(list).sort((a,b)=>boxOf(a)-boxOf(b)).slice(0,n);
function build(mode,arg){
  let pool=[];
  if(mode==="day"){
    const fresh=shuffle(unitItems(arg).filter(i=>!S.box[i.id])).slice(0,NEW_PER_ROUND);
    const rev=weakest(ITEMS.filter(i=>S.box[i.id]&&isDue(i)),REV_PER_ROUND);
    pool=shuffle(fresh.concat(rev));
  }else if(mode==="mock"){
    pool=shuffle(weakest(ITEMS,25));
  }else if(mode==="review"){
    let due=ITEMS.filter(i=>S.box[i.id]&&isDue(i));
    if(due.length<10)due=weakest(ITEMS.filter(i=>S.box[i.id]),15);
    pool=shuffle(due).slice(0,20);
  }else if(mode==="cat"){
    pool=shuffle(weakest(unitItems(arg),20));
  }else if(mode==="skill"){
    const us=UNITS.filter(x=>x.u!==MOCK&&x.sk.includes(arg)).map(x=>x.u);
    pool=shuffle(weakest(ITEMS.filter(i=>us.includes(i.u)),20));
  }else if(mode==="mysyn"){
    const v=synItems().filter(i=>i.qs[0].o.length>=4);v.forEach(i=>BYID[i.id]=i);
    pool=shuffle(v).slice(0,20);
  }else if(mode==="para"){
    pool=shuffle([17,18,19,20].flatMap(u=>weakest(unitItems(u),5)));
  }else if(mode==="weak"){
    pool=shuffle(ITEMS.filter(i=>S.box[i.id]&&S.box[i.id].wrong>0&&S.box[i.id].box<=2)).slice(0,20);
  }
  const queue=pool.map(i=>({id:i.id,qi:Math.floor(Math.random()*i.qs.length),retry:false}));
  return{mode,arg,queue,pos:0,right:0,firstTry:{},missed:[],answered:false,pick:null,built:[],tokens:[]};
}
function start(mode,arg){
  const s=build(mode,arg);
  if(!s.queue.length&&mode==="mysyn"){V={view:"syn",flash:"至少需要 4 組同義詞才能出選擇題。"};render();return}
  if(!s.queue.length){V={view:"home",flash:mode==="weak"?"錯題本目前是空的，先完成一回合吧。":"還沒有可以複習的項目，先從今天的單元開始。"};render();return}
  V={view:"q",s};prepQ();render();window.scrollTo(0,0);
}
function cur(){const s=V.s,e=s.queue[s.pos],it=BYID[e.id];return{e,it,q:it.qs[e.qi]}}
function prepQ(){
  const s=V.s;s.answered=false;s.pick=null;s.built=[];s.ok=null;s.spoke=false;s.rw=null;s.draft=null;
  const {q}=cur();
  if(q.t==="mc")s.opts=shuffle(q.o);
  if(q.t==="or")s.tokens=shuffle(q.a.split(" ").map((w,k)=>({w,k})));
}
function grade(ok){
  const s=V.s,{e,it}=cur();s.answered=true;s.ok=ok;
  if(!(e.id in s.firstTry)&&e.id.startsWith("my:")){
    s.firstTry[e.id]=ok;if(ok)s.right++;else s.missed.push(e.id);
  }else if(!(e.id in s.firstTry)){
    s.firstTry[e.id]=ok;
    const r=S.box[e.id]||{box:0,due:today(),wrong:0,seen:0};
    r.seen++;
    if(ok){r.box=Math.min(5,r.box+1);r.due=addDays(today(),INT[r.box])}
    else{r.box=1;r.due=today();r.wrong++;s.missed.push(e.id)}
    S.box[e.id]=r;S.total=(S.total||0)+1;save();
    if(ok)s.right++;
  }
  if(!ok&&!e.retry){
    const alt=it.qs.length>1?(e.qi+1)%it.qs.length:e.qi;
    s.queue.push({id:e.id,qi:alt,retry:true});
  }
  render();
}
function next(){const s=V.s;s.pos++;if(s.pos>=s.queue.length){finish();return}prepQ();render();window.scrollTo(0,0)}
function finish(){
  const t=today();
  if(S.streak.last!==t){S.streak.count=S.streak.last===addDays(t,-1)?S.streak.count+1:1;S.streak.last=t}
  save();V={view:"end",s:V.s};render();window.scrollTo(0,0);
}

function book(){
  const f=V.filter||"all";

function enVoices(){try{return speechSynthesis.getVoices().filter(v=>/^en/i.test(v.lang))}catch(e){return[]}}
function playLines(lines,rate,onEnd){
  try{speechSynthesis.cancel()}catch(e){return}
  const vs=enVoices(),pref=vs.filter(v=>/en-GB|en-AU/i.test(v.lang));const pool=(pref.length>=2?pref:vs);
  const spk=[...new Set(lines.map(l=>l[0]))];let last=null;
  lines.forEach(([s,t])=>{const idx=spk.indexOf(s);(t.match(/[^.?!…]+[.?!…]*["’)]*\s*/g)||[t]).forEach(seg=>{
    const u=new SpeechSynthesisUtterance(seg.trim());if(!u.text)return;const v=pool.length?pool[idx%pool.length]:null;
    if(v){u.voice=v;u.lang=v.lang}else u.lang="en-GB";u.rate=rate||1;u.pitch=idx%2?0.85:1.05;speechSynthesis.speak(u);last=u})});
  if(last&&onEnd)last.onend=onEnd;
}

function mergeState(L,R){const out=JSON.parse(JSON.stringify(R));
  out.box=out.box||{};for(const [k,v] of Object.entries(L.box||{})){const r=out.box[k];if(!r||(v.seen||0)>(r.seen||0))out.box[k]=v}
  out.syn=Array.isArray(out.syn)?out.syn:[];for(const p of (L.syn||[]))if(!out.syn.some(q=>synKey(q.a,q.b)===synKey(p.a,p.b)))out.syn.push(p);
  out.custom=Array.isArray(out.custom)?out.custom:[];for(const c of (L.custom||[]))if(!out.custom.some(x=>x.id===c.id))out.custom.push(c);
  out.lab=out.lab&&typeof out.lab==="object"?out.lab:{};for(const [k,v] of Object.entries(L.lab||{})){const r=out.lab[k];if(!r)out.lab[k]=v;else{const b=Math.max(r.best||0,v.best||0);out.lab[k]=Object.assign({},(L._at||0)>(R._at||0)?Object.assign({},r,v):Object.assign({},v,r),{best:b})}}
  out.done=Object.assign({},L.done||{},out.done||{});
  out.total=Math.max(L.total||0,out.total||0);
  const ls=L.streak||{},rs=out.streak||{};out.streak=(ls.last||"")>(rs.last||"")?ls:(ls.last===rs.last&&(ls.count||0)>(rs.count||0)?ls:rs);
  if(!out.streak||!out.streak.last)out.streak={last:"",count:0};
  const lr=L.rlog||{};out.rlog=Object.assign({},out.rlog||{});for(const [d,o] of Object.entries(lr)){const t=out.rlog[d]=Object.assign({},out.rlog[d]||{});for(const [f,n] of Object.entries(o))t[f]=Math.max(t[f]||0,n)}
  const hs=new Map();[...(Array.isArray(out.rhist)?out.rhist:[]),...(Array.isArray(L.rhist)?L.rhist:[])].forEach(x=>hs.set(x.ts+":"+x.k,x));out.rhist=[...hs.values()].sort((a,b)=>a.ts-b.ts).slice(-600);
  if(L.plan&&(!out.plan||(L.plan.set||0)>(out.plan.set||0)))out.plan=L.plan;
  for(const k of Object.keys(L))if(!(k in out))out[k]=L[k];
  out._at=Math.max(L._at||0,R._at||0);return out}

"2. Give ORS frequently and in small amounts, for example 5 mL every 1–2 minutes by syringe.",
"3. Continue breastfeeding throughout rehydration.",
"4. Consider nasogastric ORS if the child persistently vomits or refuses to drink.",
"5. Use intravenous fluids if shock is suspected or confirmed, or if the child deteriorates despite oral rehydration.",
"6. After rehydration, reintroduce the usual diet; avoid fruit juices and carbonated drinks until the diarrhoea has stopped."]},
{k:"C",h:"Ondansetron: drug information",fmt:"table",s:[
"Indication | Single dose for vomiting in children aged 6 months and over with mild to moderate dehydration",
"Dose (orally dispersible tablet) | 8–15 kg: 2 mg; 15–30 kg: 4 mg; over 30 kg: 8 mg",
"Contraindication | Congenital long QT syndrome",
"Caution | Other QT-prolonging drugs; electrolyte disturbance",
"Common adverse effects | Headache, constipation; may increase diarrhoea"]},
{k:"D",h:"Caring for your child with diarrhoea and vomiting at home",fmt:"leaflet",s:[
"Most children get better within a week: diarrhoea usually stops within 5 to 7 days and vomiting within 3 days.",
"Give small sips of fluid often, even if your child is still vomiting.",
"Keep your child away from nursery or school until 48 hours after the last episode of diarrhoea or vomiting.",
"Wash hands with soap and water; alcohol gels do not kill all the germs that cause gastroenteritis.",
"Seek urgent help if your child becomes drowsy, passes no urine for 12 hours, or has green vomit."]}],

{id:"sc_jaund",title:"Neonatal jaundice",block:true,texts:[
{k:"A",h:"Phototherapy thresholds for term babies (38 weeks or more)",fmt:"table",s:[
"Age 24 hours | Start phototherapy at bilirubin 200 micromol/L | Exchange transfusion at 350 micromol/L",
"Age 48 hours | Phototherapy 250 micromol/L | Exchange transfusion 450 micromol/L",
"Age 72 hours | Phototherapy 300 micromol/L | Exchange transfusion 450 micromol/L",
"Age 96 hours and over | Phototherapy 350 micromol/L | Exchange transfusion 450 micromol/L",
"Use the lower-threshold chart for babies born before 38 weeks."]},
{k:"B",h:"Investigations for jaundice in the first 24 hours",fmt:"list",s:[
"Jaundice that appears within 24 hours of birth must always be treated as pathological.",
"Measure serum bilirubin urgently, within 2 hours.",
"Request blood group and direct antiglobulin test (DAT) for mother and baby.",
"Request a full blood count and blood film to look for haemolysis.",
"Consider G6PD levels, taking into account ethnic origin and family history.",
"Do not use a transcutaneous bilirubinometer in this group."]},
{k:"C",h:"Nursing care during phototherapy",fmt:"steps",s:[
"Place the baby on its back, unclothed except for a nappy, under the light source.",
"Protect the eyes with eye shields and check them regularly for discharge.",
"Interrupt phototherapy for feeds of up to 30 minutes; do not interrupt if bilirubin is approaching the exchange level.",
"Repeat bilirubin 4–6 hours after starting, then every 6–12 hours once levels are stable or falling.",
"Stop phototherapy when bilirubin is more than 50 micromol/L below the threshold, and check for rebound 12–18 hours later."]},
{k:"D",h:"Jaundice in newborn babies: information for parents",fmt:"leaflet",s:[
"Jaundice is common and usually harmless; it often appears on day 2 or 3 and fades within two weeks.",
"Feed your baby often, at least 8 to 12 times every 24 hours.",
"Putting your baby in sunlight is not a safe treatment for jaundice.",
"Contact your midwife if your baby's stools are pale or chalky, or the urine is dark.",
"Jaundice that lasts longer than 14 days in a term baby needs a check-up."]}],

{id:"sc_ana",title:"Anaphylaxis in children",block:true,texts:[
{k:"A",h:"Intramuscular adrenaline (1 mg/mL) doses",fmt:"table",s:[
"Under 6 months | 0.1 mL (100 micrograms)",
"6 months to 5 years | 0.15 mL (150 micrograms)",
"6–11 years | 0.3 mL (300 micrograms)",
"12 years and over | 0.5 mL (500 micrograms)",
"Repeat after 5 minutes if there is no improvement.",
"Inject into the anterolateral thigh."]},
{k:"B",h:"Emergency management of anaphylaxis",fmt:"steps",s:[
"1. Call for help and remove the trigger if possible.",
"2. Lie the patient flat with legs raised; allow the patient to sit up if breathing is difficult.",
"3. Give intramuscular adrenaline immediately; do not wait for intravenous access.",
"4. Give high-flow oxygen, and a 10 mL/kg crystalloid bolus if there is circulatory compromise.",
"5. If there is no improvement after two doses of intramuscular adrenaline, start an adrenaline infusion with senior support.",
"6. Antihistamines are not first-line treatment and should be given only after the patient is stabilised."]},
{k:"C",h:"Using an adrenaline auto-injector: advice for families",fmt:"leaflet",s:[
"Carry two auto-injectors at all times.",
"Remove the safety cap and press the tip firmly into the outer thigh, through clothing if necessary.",
"Hold it in place for 3 seconds, then massage the area for 10 seconds.",
"Call an ambulance after using the auto-injector, even if your child seems better.",
"Check the expiry date regularly and replace the device before it expires."]},
{k:"D",h:"Observation and discharge after anaphylaxis",fmt:"prose",s:[
"Biphasic reactions, in which symptoms return without further exposure to the trigger, occur in a small proportion of patients.",
"For this reason, children should be observed for at least 6 hours after symptoms resolve, or 12 hours if they needed two doses of adrenaline.",
"Mast cell tryptase should be measured as soon as possible after treatment, and again 1–2 hours later.",
"All children should be referred to an allergy specialist before discharge.",
"Children with asthma are at higher risk of severe reactions, so asthma control should be reviewed."]}],

/* ---------- skill 2: five terms in fifteen seconds ---------- */
function s5Terms(T){const page=T.texts.map(t=>[t.h,...(t.s||[])].join(" \n ")).join(" \n ");const uniq=x=>page.split(x).length===2;
  const UNIT=/^(micrograms?|milligrams?|minutes|hours|seconds|weeks|months|years|millilitres)$/i,MED=/(ol|ine|one|ide|itis|osis|aemia|emia|ectomy|scopy|ology|pathy|algia|oma|ase|cillin|mycin|azole|pril|sartan|ium|profen|setron|uria|ysis|otomy|coccus|bacter|ella|in)$/i,GEN=/^(medicine|routine|guideline|guidelines|examine|determine|baseline|discipline|combine|define|online|decline|someone|everyone|outside|provide|decide|inside|within|begin|protein|again|between|wherever|machine|alone|consider|bacteria|disease|diseases|release|increase|decrease|control|explain|purchase|showcase|database)$/i;
  const nums=new Set(),med=new Set(),oth=new Set();
  T.texts.forEach(t=>(t.s||[]).forEach(s=>{(s.match(/(?<![\d.,–-])\b\d+(?:[.,–-]\d+)?\s?(?:mg\/kg|mL\/kg|micrograms|micromol\/L|mmol\/L|mg|mL|hours|minutes|days|weeks|months|years|%|kg)/g)||[]).forEach(m=>nums.add(m.trim()));
    const toks=s.match(/\b[A-Za-z][A-Za-z0-9\-]{3,}\b/g)||[];toks.forEach((w,k)=>{if(UNIT.test(w)||PASTOP.has(w.toLowerCase()))return;
      if(GEN.test(w))return;if(/^[A-Z]{2,}[0-9]?$/.test(w)||(w.length>=7&&MED.test(w)))med.add(w);else if(w.length>=10)oth.add(w)})}));
  const pick=(set,n,out)=>{for(const x of shuffle([...set])){if(out.length>=n)break;const lx=x.toLowerCase();if(!uniq(x)||page.toLowerCase().split(lx).length!==2||out.some(y=>y.toLowerCase().includes(lx)||lx.includes(y.toLowerCase())))continue;out.push(x)}return out};
  const out=[];pick(nums,2,out);pick(med,5,out);pick(nums,5,out);pick(oth,5,out);return shuffle(out)}
function startRs5(id){id=id||leastSet("scan5");const T=getScan(id);const terms=s5Terms(T);V={view:"rs5",R:{id,terms,phase:"target",found:[],miss:0,t0:0,tries:0}};render();window.scrollTo(0,0)}

  if(R.phase==="hunt")return top+`<div class="qbar"><span class="label">只動眼睛，不讀句子</span>${list}<p class="muted" style="margin:0">點錯 ${R.miss} 次</p></div><div class="texts">${page}</div>`;
  const ok=R.phase==="win",sec=ok?(R.ms/1000):null;

/* ---------- full Reading mock (A + B + C, 60 minutes) ---------- */
let CHAIN=null;
function startMock(tid){CHAIN={tid,t0:Date.now(),dur:3600000,step:"RA"};startPAT(OBY[tid].RA.id,true)}
function chainNext(){if(!CHAIN)return;const tid=CHAIN.tid;
  if(CHAIN.step==="RA"){CHAIN.step="RB";startOff(tid,"RB");render();return}
  if(CHAIN.step==="RB"){CHAIN.step="RC";startOff(tid,"RC");render();return}
  CHAIN.step="end";CHAIN.endMs=Date.now()-CHAIN.t0;rhist({k:"mock",id:tid,ms:CHAIN.endMs});rlog("mock");touchStreak();save();V={view:"chainEnd"};render();window.scrollTo(0,0)}
function chainEndView(){const C=CHAIN||{},t=OBY[C.tid]||{},rb=S.lab[recKey(C.tid,"RB")]||{},rc=S.lab[recKey(C.tid,"RC")]||{},ra=C.ra||{};
  const sc=(ra.sc||0)+(rb.last||0)+(rc.last||0),n=(ra.n||0)+(rb.total||0)+(rc.total||0);
  return header()+`<section class="end"><h2>完整 Reading 模考：${esc(t.name||"")}</h2><div class="res"><div><span class="label">Part A</span><b>${ra.sc??"—"}/${ra.n??"—"}</b></div><div><span class="label">Part B</span><b>${rb.last??"—"}/${rb.total??"—"}</b></div><div><span class="label">Part C</span><b>${rc.last??"—"}/${rc.total??"—"}</b></div></div>
  <div class="res" style="margin-top:10px"><div><span class="label">總分</span><b>${sc}/${n}</b></div><div><span class="label">總用時</span><b>${fmtT(C.endMs||0)}</b></div><div><span class="label">限時</span><b>60:00</b></div></div>
  <p class="xp" style="margin-top:12px">${(C.endMs||0)>3600000?"超過 60 分鐘。Part A 嚴守 15 分鐘；Part B 每題約 1.5 分鐘；Part C 先 90 秒略讀再作答。":"在 60 分鐘內完成。"}這只是練習分數，不能直接換算成官方分數。</p>
  <div class="row" style="margin-top:12px"><button class="btn primary" data-a="rhub">回到訓練中心</button></div></section>`}
const _renderBase=render;
render=function(){if(V.view==="home")CHAIN=null;
  if(V.view==="rhub"||V.view==="pahub"){app.innerHTML=rHub();return}
  if(V.view==="rs30"){app.innerHTML=rs30View();const f=document.getElementById("r30in");if(f&&V.R.phase==="write")f.focus({preventScroll:true});return}
  if(V.view==="rs5"){app.innerHTML=rs5View();return}
  if(V.view==="rlg"){app.innerHTML=rlgView();const nb=document.getElementById("nextBtn");if(nb)nb.focus({preventScroll:true});return}
  if(V.view==="rsum"){app.innerHTML=rsumView();return}
  if(V.view==="pat"){app.innerHTML=patView();const i=document.getElementById("patin");if(i){i.focus({preventScroll:true});const v=i.value;i.value="";i.value=v}chainBar();return}
  if(V.view==="chainEnd"){app.innerHTML=chainEndView();return}
  _renderBase();chainBar()};
function chainBar(){if(!CHAIN||CHAIN.step==="end"||!["pat","oG"].includes(V.view))return;app.insertAdjacentHTML("afterbegin",`<div class="chainbar"><span>完整 Reading 模考 · ${CHAIN.step==="RA"?"Part A":CHAIN.step==="RB"?"Part B":"Part C"}</span><span class="clock" data-start="${CHAIN.t0}" data-dur="3600000">60:00</span></div>`)}
function rClick(a,b){
  if(a==="rhub"||a==="pahub"){V={view:"rhub"};render();window.scrollTo(0,0);return true}
  if(a==="planstart"||a==="planreset"){S.plan={start:today(),set:Date.now()};save();render();return true}
  if(a==="rs30"){startRs30();return true}
  if(a==="r30go"){V.R.phase="write";render();return true}
  if(a==="r30fmt"){const f=document.getElementById("r30in");if(f)V.R.txt=f.value;V.R.fmt=b.dataset.v;render();return true}
  if(a==="r30rate"){const R=V.R,T=getScan(R.sid),t=T.texts.find(x=>x.k===R.k);R.r=+b.dataset.v;rhist({k:"skim",id:R.id,r:R.r,fmt:R.fmt===textFmt(R.sid,t)});rlog("skim30");touchStreak();save();render();return true}
  if(a==="rs5"){startRs5();return true}
  if(a==="r5go"){rs5Go();return true}
  if(a==="r5hit"){const R=V.R;if(R.phase!=="hunt")return true;const i=+b.dataset.i;if(!R.found.includes(i))R.found.push(i);
    if(R.found.length===R.terms.length){R.phase="win";R.ms=Date.now()-R.t0;rhist({k:"scan5",id:R.id,ok:true,ms:R.ms,n:R.terms.length,miss:R.miss,tries:R.tries});rlog("scan5");touchStreak();save()}render();return true}
  if(a==="r5miss"){if(V.R.phase==="hunt"){V.R.miss++;render()}return true}
  if(a==="rlg"){startRlg();return true}
  if(a==="rlrel"){const R=V.R;if(R.rel)return true;R.rel=b.dataset.v;render();return true}
  if(a==="rlpick"){const R=V.R,it=R.items[R.qi],L=LITEMS[it.i];if(R.pick!=null)return true;R.pick=+b.dataset.v;const ov=k=>paWords(L.o[k]).filter(w=>paWords(L.s).includes(w)).length;
    R.res.push({rel:R.rel===L.rel,ok:R.pick===0,trap:R.pick!==0&&ov(R.pick)>=ov(0)});render();return true}
  if(a==="rlnext"){const R=V.R;R.qi++;R.rel=null;R.pick=null;if(R.qi>=R.items.length){rhist({k:"logic",sc:R.res.filter(r=>r.ok).length,n:R.res.length});rlog("logic");touchStreak();save()}render();window.scrollTo(0,0);return true}
  if(a==="rsum"){startRsum();return true}
  if(a==="pat"){startPAT(b.dataset.id);return true}
  if(a==="patR"){startPAT(leastSet("pat"));return true}
  if(a==="pamapR"){startPaMap(leastSet("map"));return true}
  if(a==="pahuntR"){startPaHunt(leastSet("hunt"));return true}
  if(a==="mockR"){const o=OFFS.filter(o=>o.RA&&o.RB&&o.RC);const c=id=>RH("mock").filter(h=>h.id===id).length;startMock(o.slice().sort((x,y)=>c(x.id)-c(y.id))[0].id);return true}
  if(a==="mock"){startMock(b.dataset.t);return true}
  if(a==="chainnext"){chainNext();return true}
  if(V.view==="pat"&&V.X){const X=V.X,T=getScan(X.id);
    if(a==="patbegin"){patBegin();return true}
    if(a==="patquit"){CHAIN=null;V={view:"rhub"};render();return true}
    if(a==="patgo"){patGo(+b.dataset.i);return true}
    if(a==="patpick"){patSet(X.qi,b.dataset.v);patGo(patNextIdx());return true}
    if(a==="pattap"){patSet(X.qi,b.dataset.v);patGo(patNextIdx());return true}
    if(a==="patnext"){patNext();return true}
    if(a==="patskip"){patSkip();return true}
    if(a==="patuns"){const k=X.unsure.indexOf(X.qi);if(k>=0)X.unsure.splice(k,1);else X.unsure.push(X.qi);patSaveDraft();render();return true}
    if(a==="patsubmit"){const left=T.q.filter((_,i)=>!patAnswered(X,i)).length;if(left&&!X.warned.sub){X.warned.sub=true;patSaveDraft();X.banner=`還有 ${left} 題空白。空白一定 0 分：用地圖猜一個再交卷。真的要交卷，再按一次「交卷」。`;render();return true}patSubmit();return true}
    if(a==="patimg"){X.showImg=!X.showImg;patSaveDraft();render();return true}}
  return false}
app.addEventListener("click",ev=>{const b=ev.target.closest("[data-a]");if(!b)return;if(rClick(b.dataset.a,b)){ev.stopImmediatePropagation()}},true);
app.addEventListener("submit",ev=>{const f=ev.target.dataset&&ev.target.dataset.f;
  if(f==="patshort"){ev.preventDefault();ev.stopImmediatePropagation();patNext();return}
  if(f==="r30"){ev.preventDefault();ev.stopImmediatePropagation();const t=document.getElementById("r30in");V.R.txt=t?t.value.trim():"";if(!V.R.txt||!V.R.fmt)return;V.R.phase="check";render();return}
  if(f==="rsum"){ev.preventDefault();ev.stopImmediatePropagation();const t=document.getElementById("ans");const s=t?t.value.trim():"";if(!s)return;V.R.txt=s;V.R.res=sumCheck(SUMM[V.R.i].p,s);rlog("summ");rhist({k:"summ",i:V.R.i,ok:V.R.res.out.every(o=>o.ok)});touchStreak();save();render();return}},true);
app.addEventListener("input",ev=>{if(ev.target.id==="patin"&&V.X)V.X.draft[V.X.qi]=ev.target.value;if(ev.target.id==="r30in"&&V.R)V.R.txt=ev.target.value},true);
/* keyword hunter v2: up to two keywords, second-choice text, micro-routine timing */
function startPaHunt(id){const T=getScan(id);const qs=shuffle(T.q.filter(q=>q.loc)).slice(0,8);
  V={view:"pahunt",P:{id,qs,qi:0,step:"kw",kws:[],kwOk:null,t0:Date.now(),kwMs:0,t1:0,first:null,res:[]}};render();window.scrollTo(0,0)}
function paHuntView(){const P=V.P,T=getScan(P.id),M=PAMAP[paKey(P.id)]||{};const lab=k=>M[k]||(T.texts.find(t=>t.k===k)||{}).h||k;
  const top=`<div class="sess-top"><button class="btn ghost" data-a="rhub">結束</button><span class="label" style="flex:1;text-align:center">關鍵字獵人 · ${esc(T.title)}</span>${P.step==="text"?`<span class="clock" data-start="${P.t1}" data-dur="10000">0:10</span>`:""}<span class="mono">${Math.min(P.qi+1,P.qs.length)}/${P.qs.length}</span></div>`;
  if(P.qi>=P.qs.length){const n=P.res.length,kw=P.res.filter(r=>r.kw).length,tx=P.res.filter(r=>r.tx).length,tx2=P.res.filter(r=>r.tx2).length,ak=avg(P.res.map(r=>r.kwMs)),at=avg(P.res.map(r=>r.ms));
   return header()+`<section class="end"><h2>關鍵字獵人完成</h2><div class="res"><div><span class="label">關鍵字</span><b>${kw}/${n}</b></div><div><span class="label">第一篇就對</span><b>${tx}/${n}</b></div><div><span class="label">第二篇才找到</span><b>${tx2}</b></div></div>
   <div class="res" style="margin-top:10px"><div><span class="label">抓關鍵字</span><b>${(ak/1000).toFixed(1)} 秒</b></div><div><span class="label">選文本</span><b>${(at/1000).toFixed(1)} 秒</b></div><div><span class="label">目標</span><b>3＋2 秒</b></div></div>
   <p class="xp" style="margin-top:14px">${at>10000?"選文本太慢，通常是在重讀。靠 45 秒地圖記住每篇是什麼，再靠關鍵字直接跳過去。":"速度很好。考試時每題只讀關鍵字附近那一兩句。"}不要四篇一起找：先選最可能的一篇，掃 15 秒沒找到再換第二篇。</p>
   <p class="note">Part A 的答案照抄原文、≤3 字、題目已給單位就不重寫。兩個答案都說得通時，選用字最接近題幹的那一個。</p>
   <div class="row" style="margin-top:12px"><button class="btn primary" data-a="pat" data-id="${P.id}">做 15 分鐘限時全套</button><button class="btn" data-a="pahunt" data-id="${P.id}">再一次</button><button class="btn ghost" data-a="rhub">回到訓練中心</button></div></section>`}
  const q=P.qs[P.qi],ks=paKeySet(T,q);
  const stem=esc(q.q.replace(/^\d+\.\s*/,"")).split(/(\s+)/).map(w=>{if(!/\S/.test(w))return w;const n=w.toLowerCase().replace(/^[^a-z0-9]+|[^a-z0-9%]+$/g,"");if(!n||PASTOP.has(n))return w;
    const sel=P.kws.includes(n);let c="";if(P.step!=="kw"){if(ks.has(n))c=" on";if(sel&&!ks.has(n))c=" miss"}else if(sel)c=" on";
    return `<button class="kw${c}" data-a="phkw" data-w="${esc(n)}" ${P.step!=="kw"?"disabled":""} style="font:inherit;border:0;background:${c===" miss"?"var(--red-soft)":""};padding:0 2px">${w}</button>`}).join("");
  let body="";
  if(P.step==="kw")body=`<p class="muted" style="margin:0">第 1 步：點出 1–2 個關鍵字（藥名、數字、病名、處置、身體部位）。動詞和介系詞是填充字。</p><div><button class="btn primary" data-a="phkwok" ${P.kws.length?"":"disabled"}>確認關鍵字</button></div>`;
  if(P.step==="text")body=`<p class="muted" style="margin:0">${P.kwOk?"✓ 好的關鍵字。":"有選到填充字或太籠統的字；標黃的才是能帶你找到答案的字。"}${P.first?`<b>不在 Text ${P.first}。</b>換第二可能的那一篇：`:"第 2 步：從地圖選最可能的一篇（目標 2 秒）。"}</p><div class="letters">${T.texts.map(t=>`<button class="btn" data-a="phtx" data-v="${t.k}" ${P.first===t.k?"disabled":""}>${t.k}</button>`).join("")}</div>`;
  if(P.step==="fb"){const r=P.res[P.res.length-1],txt=T.texts.find(t=>t.k===q.loc[0]),sen=txt&&txt.s?txt.s[q.loc[1]]:"";
   body=`<div class="fb"><div class="verdict ${r.tx?"ok":r.tx2?"":"no"}">${r.tx?"第一篇就找對":r.tx2?"第二篇找到":"在 Text "+q.loc[0]}</div>
   <p class="muted" style="margin:0">抓關鍵字 ${(r.kwMs/1000).toFixed(1)} 秒（目標 3 秒）· 選文本 ${(r.ms/1000).toFixed(1)} 秒（目標 2 秒）</p>
   <div class="tx hit"><h4><span class="k">${q.loc[0]}</span>${esc(lab(q.loc[0]))}</h4><div><span class="sen hit">${sen?logicHL(sen):"（見原版版面）"}</span></div></div>
   ${q.show||q.a?`<p class="xp">答案：<b>${esc(q.t==="match"?"Text "+q.a:q.show||"")}</b>${q.map?"　關鍵字對應：<code>"+esc(q.map[0])+"</code> ↔ <code>"+esc(q.map[1])+"</code>":""}</p>`:""}
   ${q.map?synBtnFor(q.map[0],q.map[1]):""}<div><button class="btn primary" data-a="phnext" id="nextBtn">${P.qi+1>=P.qs.length?"看結果":"下一題"}</button></div></div>`}
  return top+`<div class="qbar"><span class="label">規則 2 · 找關鍵字</span><p class="qtext">${stem}</p>${body}</div>
  ${P.step!=="fb"?`<div class="texts" style="grid-template-columns:repeat(2,minmax(0,1fr))">${T.texts.map(t=>`<div class="tx"><h4><span class="k">${t.k}</span>${esc(lab(t.k))}</h4></div>`).join("")}</div>`:""}`}
const _paClick0=paClick;
paClick=function(a,b){const P=V.P;
  if(a==="pahub"){V={view:"rhub"};render();window.scrollTo(0,0);return true}
  if(a==="phkw"&&P){if(P.step!=="kw")return true;const w=b.dataset.w,k=P.kws.indexOf(w);if(k>=0)P.kws.splice(k,1);else{if(P.kws.length>=2)P.kws.shift();P.kws.push(w)}render();return true}
  if(a==="phkwok"&&P){if(!P.kws.length)return true;const T=getScan(P.id),ks=paKeySet(T,P.qs[P.qi]);P.kwOk=P.kws.some(w=>ks.has(w))&&P.kws.every(w=>ks.has(w));P.kwMs=Date.now()-P.t0;P.step="text";P.t1=Date.now();P.first=null;render();return true}
  if(a==="phtx"&&P){if(P.step!=="text")return true;const q=P.qs[P.qi],ok=b.dataset.v===q.loc[0];
    if(!ok&&!P.first){P.first=b.dataset.v;render();return true}
    P.res.push({kw:P.kwOk,tx:ok&&!P.first,tx2:ok&&!!P.first,ms:Date.now()-P.t1,kwMs:P.kwMs});P.step="fb";render();return true}
  if(a==="phnext"&&P){P.qi++;P.step="kw";P.kws=[];P.kwOk=null;P.first=null;P.t0=Date.now();if(P.qi>=P.qs.length){const n=P.res.length,sc=P.res.filter(r=>r.kw&&r.tx).length,r=S.lab["ph_"+P.id]||{};r.last=sc;r.total=n;r.best=Math.max(r.best||0,sc);S.lab["ph_"+P.id]=r;rhist({k:"hunt",id:P.id,sc,n});rlog("hunt");touchStreak();save()}render();window.scrollTo(0,0);return true}
  if(a==="pmnext"&&P&&P.qi+1>=P.qs.length&&V.view==="pamap"){const T=getScan(P.id),nl=T.texts.filter(t=>P.pick[t.k]===t.k).length,nq=P.ans.filter(Boolean).length;rhist({k:"map",id:P.id,lab:nl,labT:T.texts.length,q:nq,qT:P.qs.length});rlog("map")}
  return _paClick0(a,b)};

function intensiveNote(q,pk){if(!q.ev)return "";const ov=o=>{const e=new Set(paWords(q.ev));return paWords(o).filter(w=>e.has(w)).length};
  const scores=q.o.map(ov),best=Math.max(...scores);let t="";
  if(pk!=null&&pk!==q.a&&scores[pk]>=scores[q.a]&&scores[pk]>0)t=`<p class="note">重字陷阱：你選的選項和原文重複 ${scores[pk]} 個字，正解只有 ${scores[q.a]} 個。Part B／C 要選意思相符的，不是字最像的。</p>`;
  else if(pk===q.a&&scores[q.a]<best)t=`<p class="note">✓ 你避開了重字陷阱：有選項和原文重複更多字，但意思不對。</p>`;
  return `<div class="map" style="display:block"><span class="label">關鍵句（精讀：文法 → 意思 → 邏輯關係）</span><p style="margin:4px 0 0">${logicHL(q.ev)}</p></div>${t}`}
function boot(data){if(data&&data.V&&(data.V.view!=="q"||(data.V.s&&data.V.s.queue.every(e=>BYID[e.id]))))V=data.V;render()}
try{window.claude?.hot?.snapshot?.(()=>({V}))}catch(e){}
window.claude?.hot?.ready?window.claude.hot.ready(boot):boot(window.claude?.hot?.data??{});
</script>
